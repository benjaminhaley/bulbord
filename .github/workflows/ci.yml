name: CI

on:
  push:
  pull_request:

env:
  DATABASE_URL: postgres://campy:campy@localhost:5432/campy_test
  PORT: 3001
  CORS_ORIGIN: http://localhost:5173
  SESSION_SECRET: ci-session-secret-not-used-anywhere-real
  WEBAUTHN_RP_ID: localhost
  WEBAUTHN_RP_NAME: Campy
  WEBAUTHN_ORIGIN: http://localhost:5173
  ROOT_INVITE_SECRET: ci-root-invite-secret
  # storage.ts reads these at module load (server boot), even though no test
  # here exercises a real upload — any non-empty values are enough to boot.
  UPLOADS_BUCKET: ci-unused-bucket
  UPLOADS_ENDPOINT: http://localhost:0
  UPLOADS_ACCESS_KEY_ID: ci-unused
  UPLOADS_SECRET_ACCESS_KEY: ci-unused
  VITE_API_URL: http://localhost:3001

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campy
          POSTGRES_PASSWORD: campy
          POSTGRES_DB: campy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U campy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: api
      - run: npm run typecheck
        working-directory: api
      - run: npm run knip
        working-directory: api
      - run: npm run db:migrate
        working-directory: api
      - run: npm test
        working-directory: api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run knip
        working-directory: web
      - run: npm test
        working-directory: web

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campy
          POSTGRES_PASSWORD: campy
          POSTGRES_DB: campy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U campy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
        working-directory: api
      - run: npm run db:migrate
        working-directory: api
      - name: Start API
        working-directory: api
        run: nohup npm run dev > /tmp/api.log 2>&1 &

      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Start web
        working-directory: web
        run: nohup npx vite preview --port 5173 > /tmp/web.log 2>&1 &

      - name: Wait for servers
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:3001/health && break; sleep 1; done
          for i in $(seq 1 30); do curl -sf http://localhost:5173 > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3001/health || (cat /tmp/api.log; exit 1)
          curl -sf http://localhost:5173 > /dev/null || (cat /tmp/web.log; exit 1)

      - name: Run Playwright e2e
        working-directory: web
        run: npx playwright test
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
