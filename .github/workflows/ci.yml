name: CI

on:
  push:
  pull_request:

env:
  DATABASE_URL: postgres://bulbord:bulbord@localhost:5432/bulbord_test
  PORT: 3001
  CORS_ORIGIN: http://localhost:5173
  SESSION_SECRET: ci-session-secret-not-used-anywhere-real
  WEBAUTHN_RP_ID: localhost
  WEBAUTHN_RP_NAME: Nettelhorst
  WEBAUTHN_ORIGIN: http://localhost:5173
  ROOT_INVITE_SECRET: ci-root-invite-secret
  # storage.ts reads these at module load (server boot), even though no test
  # here exercises a real upload — any non-empty values are enough to boot.
  UPLOADS_BUCKET: ci-unused-bucket
  UPLOADS_ENDPOINT: http://localhost:0
  UPLOADS_ACCESS_KEY_ID: ci-unused
  UPLOADS_SECRET_ACCESS_KEY: ci-unused
  # newsletter/mailer.ts reads these at module load too (same shape as
  # UPLOADS_* above) — missing since the newsletter feature shipped
  # (2026-08-02), which meant the e2e job's real `npm run dev` server boot
  # has crashed on every push since then (`RESEND_FROM_EMAIL is not set`),
  # silently skipping e2e entirely while every other CI job stayed green.
  # Found 2026-08-14 while checking CI status wasn't just assumed green.
  RESEND_FROM_EMAIL: ci-unused@example.com
  RESEND_API_KEY: re_ci_unused
  PUBLIC_API_URL: http://localhost:3001
  PUBLIC_WEB_URL: http://localhost:5173
  VITE_API_URL: http://localhost:3001

jobs:
  format-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-format-parity.mjs

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bulbord
          POSTGRES_PASSWORD: bulbord
          POSTGRES_DB: bulbord_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bulbord"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: api
      - run: npm run typecheck
        working-directory: api
      - run: npm run knip
        working-directory: api
      - run: npm run db:migrate
        working-directory: api
      - run: npm test
        working-directory: api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run knip
        working-directory: web
      # @storybook/addon-vitest runs story files (src/**/*.stories.tsx)
      # through a real headless browser, not jsdom — needed before `npm
      # test` below, which now also covers the storybook vitest project.
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test
        working-directory: web

  # Visual regression testing (added 2026-08-13, feedback #70's second
  # follow-up): publishes every Storybook story's rendered snapshot to
  # Chromatic, which flags any pixel-level diff against the last-accepted
  # baseline for human review — catches exactly the kind of silent visual
  # drift that let Camps and Events diverge for weeks (see STYLE_GUIDE.md,
  # CLAUDE.md's Camps section) without anyone noticing until a screenshot
  # comparison caught it by hand. The publish step skips itself cleanly
  # (exit 0, not a failure) until CHROMATIC_PROJECT_TOKEN is set as a repo
  # secret — see CLAUDE.md's Testing section for the one-time account setup
  # this needs. Deliberately not a job-level `if: secrets.X != ''` — GitHub
  # Actions rejects referencing `secrets` directly in a job-level `if:`
  # (fails the whole workflow file at parse time, not just this job; found
  # the hard way when this job's first version broke every other job too),
  # so the presence check has to happen inside a step instead.
  # `--exit-zero-on-changes`: a real visual change isn't a bug by itself
  # (that's the whole point of a UI having new work land on it) — the build
  # still succeeds and the diff waits in Chromatic's UI for a look, rather
  # than blocking every push that changes a pixel.
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: web
      - name: Publish to Chromatic
        working-directory: web
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "CHROMATIC_PROJECT_TOKEN not set yet — skipping Chromatic publish."
            exit 0
          fi
          npm run chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bulbord
          POSTGRES_PASSWORD: bulbord
          POSTGRES_DB: bulbord_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bulbord"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
        working-directory: api
      - run: npm run db:migrate
        working-directory: api
      - name: Start API
        working-directory: api
        run: nohup npm run dev > /tmp/api.log 2>&1 &

      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Start web
        working-directory: web
        run: nohup npx vite preview --port 5173 > /tmp/web.log 2>&1 &

      - name: Wait for servers
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:3001/health && break; sleep 1; done
          for i in $(seq 1 30); do curl -sf http://localhost:5173 > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3001/health || (cat /tmp/api.log; exit 1)
          curl -sf http://localhost:5173 > /dev/null || (cat /tmp/web.log; exit 1)

      - name: Run Playwright e2e
        working-directory: web
        run: npx playwright test
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
