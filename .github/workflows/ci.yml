name: CI

on:
  push:
  pull_request:

env:
  DATABASE_URL: postgres://bulbord:bulbord@localhost:5432/bulbord_test
  PORT: 3001
  CORS_ORIGIN: http://localhost:5173
  SESSION_SECRET: ci-session-secret-not-used-anywhere-real
  WEBAUTHN_RP_ID: localhost
  WEBAUTHN_RP_NAME: Nettelhorst
  WEBAUTHN_ORIGIN: http://localhost:5173
  ROOT_INVITE_SECRET: ci-root-invite-secret
  # storage.ts reads these at module load (server boot), even though no test
  # here exercises a real upload — any non-empty values are enough to boot.
  UPLOADS_BUCKET: ci-unused-bucket
  UPLOADS_ENDPOINT: http://localhost:0
  UPLOADS_ACCESS_KEY_ID: ci-unused
  UPLOADS_SECRET_ACCESS_KEY: ci-unused
  # Required too, and must be dev/ outside production (uploads/key-prefix.ts).
  UPLOADS_KEY_PREFIX: dev/
  # newsletter/mailer.ts reads these at module load too (same shape as
  # UPLOADS_* above) — missing since the newsletter feature shipped
  # (2026-08-02), which meant the e2e job's real `npm run dev` server boot
  # has crashed on every push since then (`RESEND_FROM_EMAIL is not set`),
  # silently skipping e2e entirely while every other CI job stayed green.
  # Found 2026-08-14 while checking CI status wasn't just assumed green.
  RESEND_FROM_EMAIL: ci-unused@example.com
  RESEND_API_KEY: re_ci_unused
  PUBLIC_API_URL: http://localhost:3001
  PUBLIC_WEB_URL: http://localhost:5173
  VITE_API_URL: http://localhost:3001

jobs:
  format-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-format-parity.mjs

  # Labs stay independent of the app — see labs/README.md.
  lab-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-lab-isolation.mjs

  ionic-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-ionic-coverage.mjs

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bulbord
          POSTGRES_PASSWORD: bulbord
          POSTGRES_DB: bulbord_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bulbord"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: api
      - run: npm run typecheck
        working-directory: api
      - run: npm run knip
        working-directory: api
      - run: npm run db:migrate
        working-directory: api
      - run: npm test
        working-directory: api

  web:
    runs-on: ubuntu-latest
    # Same Playwright image as e2e (see there), so the storybook browser
    # tests don't depend on the runner's apt mirror.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run knip
        working-directory: web
      # @storybook/addon-vitest runs story files (src/**/*.stories.tsx)
      # through a real headless browser, not jsdom — needed before `npm
      # test` below, which now also covers the storybook vitest project.
      - run: npx playwright install chromium
        working-directory: web
      - run: npm test
        working-directory: web

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    # Normally ~2 min; one run hung for 40+ min (2026-10-27) and would have
    # held the deploy job behind it.
    timeout-minutes: 15
    # Playwright's own image ships Chromium, WebKit and every system library
    # they need. Installing those with apt on the bare runner (`playwright
    # install --with-deps`) stalled on a crawling apt mirror twice on
    # 2026-10-27 and ate the whole 15 minutes. Keep the tag in step with
    # web/package.json's playwright version.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      # Inside a container job the Postgres service is reached by its name.
      DATABASE_URL: postgres://bulbord:bulbord@postgres:5432/bulbord_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bulbord
          POSTGRES_PASSWORD: bulbord
          POSTGRES_DB: bulbord_test
        options: >-
          --health-cmd "pg_isready -U bulbord"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
        working-directory: api
      - run: npm run db:migrate
        working-directory: api
      - name: Start API
        working-directory: api
        run: nohup npm run dev > /tmp/api.log 2>&1 &

      - run: npm ci
        working-directory: web
      # webkit alongside chromium: webkit-onboarding.spec.ts needs a real
      # WebKit browser (Safari's engine) — see that file's own header for why.
      # A no-op when the container tag matches; downloads (no apt) if not.
      - run: npx playwright install chromium webkit
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Start web
        working-directory: web
        run: nohup npx vite preview --port 5173 --host 127.0.0.1 > /tmp/web.log 2>&1 &

      - name: Wait for servers
        run: |
          up() { node -e "fetch('$1').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"; }
          for i in $(seq 1 30); do up http://localhost:3001/health && break; sleep 1; done
          for i in $(seq 1 30); do up http://localhost:5173 && break; sleep 1; done
          up http://localhost:3001/health || (cat /tmp/api.log; exit 1)
          up http://localhost:5173 || (cat /tmp/web.log; exit 1)

      - name: Run Playwright e2e
        working-directory: web
        run: npx playwright test
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  # Production images, built once per push to main alongside the tests. The api
  # image also runs the three cron services. See api/Dockerfile, web/Dockerfile.
  build-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ghcr.io/benjaminhaley/bulbord-${{ matrix.service }}:${{ github.sha }}
          build-args: VITE_API_URL=https://api-production-a551.up.railway.app
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Deploys main to production once every check above has passed: Railway just
  # pulls the images built above (no build on Railway's side).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [format-parity, lab-isolation, ionic-coverage, api, web, e2e, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy images to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN secret is not set; skipping deploy"
            exit 0
          fi
          scripts/railway-deploy-images.sh
