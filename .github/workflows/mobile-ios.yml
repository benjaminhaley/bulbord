name: iOS Release

# Manual only — this ships a real TestFlight/App Store build, unlike ci.yml's
# on-every-push checks. Needs an App Store Connect API key (Users and Access
# > Integrations in App Store Connect) once Apple Developer enrollment is
# approved. Required repo secrets:
#   APPLE_TEAM_ID    — Apple Developer team ID
#   APPLE_ID         — the enrolled Apple ID's email
#   ASC_KEY_ID       — App Store Connect API key ID
#   ASC_ISSUER_ID    — App Store Connect API issuer ID
#   ASC_KEY_CONTENT  — the raw .p8 key file contents (paste as-is, no
#                      base64 encoding needed — `gh secret set` handles
#                      multi-line values fine)
#   IOS_DIST_CERT_P12_BASE64 — a durable "iOS Distribution" cert + private
#                      key, exported as a .p12 and base64-encoded. Imported
#                      fresh into each run's keychain rather than minting a
#                      new certificate every time (see the Fastfile) —
#                      every CI run is a brand-new machine, and Apple caps
#                      how many Distribution certs can be active at once.
#   IOS_DIST_CERT_PASSWORD — the .p12's export password
# See web/ios/App/fastlane/Fastfile — no physical Mac needed, this runs
# entirely on GitHub's macOS runner (see CLAUDE.md's Platform strategy).
on:
  workflow_dispatch: {}

jobs:
  beta:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install web deps and sync native project
        working-directory: web
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: web/ios/App

      - name: Decode signing certificate
        working-directory: web/ios/App
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
        run: echo "$IOS_DIST_CERT_P12_BASE64" | base64 -d > dist_cert.p12

      - name: Build and upload to TestFlight
        working-directory: web/ios/App
        env:
          FASTLANE_APPLE_ID: ${{ secrets.APPLE_ID }}
          FASTLANE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          IOS_DIST_CERT_P12_PATH: dist_cert.p12
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: bundle exec fastlane beta

      - name: Clean up local secrets
        if: always()
        working-directory: web/ios/App
        run: rm -f dist_cert.p12
