<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="robots" content="noindex, nofollow" />
<title>Multiplication Shootout</title>
<style>
  :root {
    --pitch: #2e8b3d;
    --pitch-dark: #256e31;
    --line: rgba(255,255,255,0.85);
    --gold: #ffd23f;
    --ink: #0b2e13;
    --paper: #ffffff;
    --danger: #e0473a;
    --shadow: 0 6px 0 rgba(0,0,0,0.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    /* Deliberately NOT `height: 100%` — an explicit fixed height here (as
       opposed to the default `auto`) stops the browser's normal
       viewport-scroll propagation from ever seeing content taller than one
       screen: document.documentElement.scrollHeight gets stuck reporting
       exactly the viewport height regardless of how much #app actually
       overflows it, so the page becomes completely unscrollable — not just
       visually clipped, genuinely unreachable, confirmed directly
       (2026-09-10: "I can't actually scroll to the bottom"). min-height
       below (both here and on #app) already covers "fill the screen when
       content is short"; height:auto is what lets it grow past that when
       content is tall.
    */
    background: linear-gradient(180deg, var(--pitch) 0%, var(--pitch-dark) 100%);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    overscroll-behavior: none;
    user-select: none;
  }
  body {
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  #app {
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    /* Was `overflow: hidden` — with the end screen's tally + rank reveal +
       name entry + leaderboard list + buttons often taller than one phone
       viewport (especially with Safari's own chrome eating vertical space),
       that silently clipped the bottom of the page with no way to reach it
       at all, not even via the browser's own scroll (2026-09-10: "I can't
       actually scroll to the bottom"). Only horizontal overflow needs
       clipping (nothing here is meant to scroll sideways); vertical
       overflow now just grows the page and the browser's normal scroll
       reaches it, same as any ordinary web page. */
    overflow-x: hidden;
  }

  /* Faint pitch markings behind everything */
  #app::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 50% 42%, transparent 0 58px, var(--line) 58px 60px, transparent 60px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 40px, rgba(255,255,255,0.09) 40px 80px);
    opacity: 0.5;
  }

  header {
    position: relative;
    padding: 18px 20px 10px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--paper);
    text-shadow: 0 2px 0 rgba(0,0,0,0.25);
    letter-spacing: 0.02em;
  }
  header .sub {
    color: rgba(255,255,255,0.85);
    font-size: 0.85rem;
    margin-top: 4px;
    font-weight: 600;
  }
  /* Matches the real app's own always-present top-left back button
     (2026-09-10 feedback: "go back, which should appear in the top left
     corner in this case") — goes to whatever page was open before this one
     (a real Labs-page visit, most often) when there's genuine history to
     return to, else falls back to the app root. */
  .back-link {
    position: absolute;
    top: 14px;
    left: 16px;
    font-size: 1.5rem;
    line-height: 1;
    background: none;
    border: none;
    color: rgba(255,255,255,0.85);
    padding: 4px 8px;
    cursor: pointer;
  }
  .back-link:active { color: rgba(255,255,255,1); }

  main {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 8px 20px 28px;
  }

  .card {
    background: var(--paper);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 20px;
  }

  /* ---------- Start screen ---------- */
  #screen-start .card { text-align: center; }
  .ball-bounce {
    font-size: 3rem;
    display: inline-block;
    animation: bounce 1.4s ease-in-out infinite;
    margin-bottom: 4px;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) scaleX(1); }
    45% { transform: translateY(-26px) scaleX(1); }
    50% { transform: translateY(-28px) scaleX(1.08); }
    75% { transform: translateY(0) scaleX(1.1); }
    80% { transform: translateY(0) scaleX(0.94); }
  }
  .start-tagline {
    font-weight: 700;
    color: #3a4a55;
    font-size: 0.92rem;
    margin: 2px 0 4px;
  }
  .best-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 10px 0 4px;
    flex-wrap: wrap;
  }
  .pill {
    background: #eefbf0;
    border: 2px solid #cdeed3;
    border-radius: 999px;
    padding: 6px 14px;
    font-weight: 800;
    font-size: 0.82rem;
    color: #1b6b2c;
    white-space: nowrap;
  }
  .record-pill {
    display: inline-block;
    background: #fff7dd;
    border: 2px solid #ffe79c;
    border-radius: 999px;
    padding: 7px 16px;
    font-weight: 800;
    font-size: 0.82rem;
    color: #8a6400;
    margin: 12px 0 4px;
  }
  .start-btn {
    margin-top: 20px;
    width: 100%;
    border: none;
    border-radius: 16px;
    padding: 16px 0;
    font-size: 1.15rem;
    font-weight: 900;
    color: white;
    background: var(--danger);
    box-shadow: 0 5px 0 #a5271d;
    cursor: pointer;
  }
  .start-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #a5271d; }
  .link-btn {
    display: block;
    margin: 14px auto 0;
    border: none;
    background: none;
    color: #2f6b3f;
    font-weight: 800;
    font-size: 0.88rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 6px;
  }

  /* ---------- Game screen ---------- */
  #screen-game { display: none; flex-direction: column; flex: 1; }

  .shot-tracker {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .shot-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .shot-dot.goal { background: var(--gold); }
  .shot-dot.miss { background: var(--danger); }
  .shot-dot.current { box-shadow: 0 0 0 3px rgba(255,255,255,0.7); }

  .goal-scene {
    position: relative;
    height: 108px;
    margin: 4px auto 10px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .goal-frame {
    font-size: 4.4rem;
    line-height: 1;
  }
  .ball-fly {
    position: absolute;
    left: 50%;
    bottom: 6px;
    font-size: 2rem;
    transform: translateX(-50%);
    transition: transform 0.5s cubic-bezier(.2,.7,.3,1), opacity 0.4s;
  }
  .ball-fly.shoot-good { transform: translate(-50%, -66px) scale(0.7); }
  .ball-fly.shoot-bad { transform: translate(calc(-50% + 70px), -14px) rotate(160deg); opacity: 0.7; }

  .result-banner {
    text-align: center;
    font-weight: 900;
    font-size: 1.15rem;
    min-height: 1.5em;
    margin-bottom: 2px;
  }
  .result-banner.good { color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,0.35); }
  .result-banner.bad { color: #ffdad4; }

  /* A miss costs real time, live — no arithmetic added after the fact (see
     endRound below). This is the "you're in the penalty box" visual: a
     referee's yellow card plus a real, visible 2-second countdown before
     the next shot is allowed, during which the timer up in .score-strip
     keeps running exactly as normal. */
  .penalty-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 30px;
    margin-bottom: 6px;
  }
  .yellow-card {
    display: inline-block;
    font-size: 1.5rem;
    transform: rotate(-8deg);
    animation: card-show 0.35s ease-out;
  }
  @keyframes card-show {
    0% { transform: scale(0.3) rotate(-8deg); opacity: 0; }
    65% { transform: scale(1.2) rotate(-8deg); opacity: 1; }
    100% { transform: scale(1) rotate(-8deg); }
  }
  .penalty-text {
    font-weight: 900;
    font-size: 0.88rem;
    color: #fff7dd;
    background: rgba(0,0,0,0.2);
    padding: 5px 12px;
    border-radius: 999px;
  }
  .penalty-text b { color: var(--gold); font-variant-numeric: tabular-nums; }

  .score-strip {
    display: flex;
    justify-content: center;
    gap: 18px;
    color: rgba(255,255,255,0.92);
    font-weight: 700;
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .score-strip b { font-size: 1.3rem; font-variant-numeric: tabular-nums; }
  #timer-val { color: var(--gold); }
  .restart-btn {
    display: block;
    margin: 18px auto 4px;
    border: 2px solid rgba(255,255,255,0.55);
    background: rgba(0,0,0,0.15);
    color: rgba(255,255,255,0.95);
    font-weight: 800;
    font-size: 1rem;
    padding: 13px 26px;
    border-radius: 14px;
    cursor: pointer;
  }
  .restart-btn:active { background: rgba(0,0,0,0.3); transform: translateY(1px); }

  .question-card {
    background: var(--paper);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 22px 20px 20px;
    text-align: center;
  }
  .question-text {
    font-size: 2.2rem;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: 0.02em;
  }
  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 18px;
  }
  .choice-btn {
    border: none;
    border-radius: 14px;
    padding: 16px 0;
    font-size: 1.35rem;
    font-weight: 800;
    background: #eef2f6;
    color: var(--ink);
    box-shadow: 0 4px 0 #c9d2db;
    cursor: pointer;
  }
  .choice-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
  .choice-btn:disabled { cursor: default; }
  .choice-btn.correct { background: #d6f5dc; color: #1b6b2c; box-shadow: 0 4px 0 #9edcac; }
  .choice-btn.wrong { background: #fbdad6; color: #9a2c22; box-shadow: 0 4px 0 #f0aea5; }

  /* ---------- End screen: tally card ---------- */
  #screen-end { display: none; }
  #screen-end .card { text-align: center; }
  .trophy { font-size: 3rem; margin-bottom: 2px; }
  .final-title {
    font-weight: 800;
    font-size: 1.02rem;
    color: #2f6b3f;
    margin-bottom: 12px;
  }

  .tally {
    background: #f4f8f5;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 4px;
  }
  .tally-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
    font-size: 0.95rem;
    color: #45564c;
    padding: 5px 0;
  }
  .tally-row .val { font-variant-numeric: tabular-nums; font-weight: 900; color: var(--ink); }
  .tally-divider { border: none; border-top: 2px dashed #d3e0d7; margin: 6px 0; }
  .tally-row.final { font-size: 1.15rem; color: var(--ink); }
  .tally-row.final .val {
    font-size: 1.7rem;
    color: var(--pitch-dark);
    animation: pop-in 0.4s ease-out;
  }
  @keyframes pop-in {
    0% { transform: scale(0.4); opacity: 0; }
    70% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }

  .new-best {
    display: inline-block;
    background: var(--gold);
    color: #6b4c00;
    font-weight: 900;
    font-size: 0.78rem;
    padding: 4px 10px;
    border-radius: 999px;
    margin: 8px 0 2px;
  }

  .rank-reveal {
    margin-top: 14px;
    font-weight: 800;
    font-size: 1rem;
    color: var(--ink);
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.5s ease;
    transform: translateY(6px);
  }
  .rank-reveal.show { opacity: 1; transform: translateY(0); }
  .rank-reveal .big { font-size: 1.4rem; color: var(--danger); }

  /* ---------- Name entry ---------- */
  .name-entry {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.4s ease, max-height 0.4s ease;
  }
  .name-entry.show { opacity: 1; max-height: 60px; }
  .name-entry input {
    flex: 1;
    border: 2px solid #dfe6ec;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--ink);
    min-width: 0;
  }
  .name-entry input:focus { outline: none; border-color: var(--pitch); }
  .add-btn {
    border: none;
    border-radius: 12px;
    padding: 0 16px;
    font-weight: 800;
    font-size: 0.85rem;
    background: var(--pitch);
    color: white;
    box-shadow: 0 3px 0 var(--pitch-dark);
    cursor: pointer;
  }
  .add-btn:active { transform: translateY(2px); box-shadow: none; }
  .skip-link {
    display: block;
    margin: 6px auto 0;
    border: none;
    background: none;
    color: #6b7a72;
    font-weight: 700;
    font-size: 0.8rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.4s ease, max-height 0.4s ease;
  }
  .skip-link.show { opacity: 1; max-height: 30px; }
  .added-note {
    margin-top: 10px;
    font-weight: 800;
    font-size: 0.85rem;
    color: #1b6b2c;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.4s ease, max-height 0.4s ease;
  }
  .added-note.show { opacity: 1; max-height: 30px; }

  /* ---------- Leaderboard ---------- */
  .leaderboard-wrap {
    margin-top: 16px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.5s ease, max-height 0.5s ease;
  }
  .leaderboard-wrap.show { opacity: 1; max-height: 320px; }
  .leaderboard-title {
    font-weight: 900;
    font-size: 0.95rem;
    color: var(--ink);
    margin-bottom: 8px;
    text-align: left;
  }
  .leaderboard-list {
    max-height: 260px;
    overflow-y: auto;
    scroll-behavior: smooth;
    border-radius: 12px;
    background: #f4f8f5;
    padding: 6px;
    -webkit-overflow-scrolling: touch;
  }
  .lb-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 8px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.9rem;
    color: #3a4a4a;
  }
  .lb-row + .lb-row { margin-top: 2px; }
  .lb-rank { width: 28px; text-align: center; font-weight: 900; flex-shrink: 0; }
  .lb-name {
    flex: 1;
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lb-time { font-variant-numeric: tabular-nums; font-weight: 900; color: var(--ink); flex-shrink: 0; }
  .lb-row.me {
    background: #fff7dd;
    box-shadow: 0 0 0 2px var(--gold) inset;
  }
  .lb-row.pulse { animation: lb-pulse 1s ease-in-out 3; }
  @keyframes lb-pulse {
    0%, 100% { background: #fff7dd; }
    50% { background: #ffe79c; }
  }
  .lb-empty { text-align: center; color: #7a8a80; font-weight: 700; font-size: 0.85rem; padding: 18px 4px; }

  .end-buttons { display: flex; gap: 10px; margin-top: 18px; }
  .end-buttons button {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 14px 0;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
  }
  #play-again-btn { background: var(--pitch); color: white; box-shadow: 0 4px 0 var(--pitch-dark); }
  #home-btn { background: #eef2f6; color: #4a5568; box-shadow: 0 4px 0 #c9d2db; }
  .end-buttons button:active { transform: translateY(3px); box-shadow: none; }

  /* ---------- Leaderboard-only screen ---------- */
  #screen-leaderboard { display: none; }
  #screen-leaderboard .card { text-align: center; }
  #screen-leaderboard .leaderboard-wrap { opacity: 1; max-height: none; margin-top: 4px; }
  #screen-leaderboard .leaderboard-list { max-height: 380px; }
  #back-from-leaderboard-btn {
    width: 100%;
    margin-top: 16px;
    border: none;
    border-radius: 14px;
    padding: 14px 0;
    font-weight: 800;
    font-size: 0.95rem;
    background: #eef2f6;
    color: #4a5568;
    box-shadow: 0 4px 0 #c9d2db;
    cursor: pointer;
  }
  #back-from-leaderboard-btn:active { transform: translateY(3px); box-shadow: none; }

  .hidden { display: none !important; }

  /* confetti burst */
  .confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 5;
  }
  .confetti span {
    position: absolute;
    top: -10px;
    font-size: 1.4rem;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="back-link" id="back-btn" type="button" aria-label="Back">←</button>
    <h1>⚽ Multiplication Shootout</h1>
    <div class="sub" id="header-sub">Race the clock — 10 shots, best time wins!</div>
  </header>

  <main>
    <!-- START SCREEN -->
    <section id="screen-start">
      <div class="card">
        <div class="ball-bounce">⚽</div>
        <div class="start-tagline">Times tables 1–12, best time wins.</div>
        <div class="best-row" id="best-row"></div>
        <div id="record-row"></div>

        <button class="start-btn" id="start-btn" type="button">⏱ Start Shootout</button>
        <button class="link-btn" id="view-leaderboard-btn" type="button">🏆 View Leaderboard</button>
      </div>
    </section>

    <!-- GAME SCREEN -->
    <section id="screen-game">
      <div class="shot-tracker" id="shot-tracker"></div>
      <div class="score-strip">
        <div>⏱ <b id="timer-val">0.0s</b></div>
      </div>
      <div class="goal-scene">
        <div class="goal-frame">🥅</div>
        <div class="ball-fly" id="ball-fly">⚽</div>
      </div>
      <div class="result-banner" id="result-banner">&nbsp;</div>
      <div class="penalty-box hidden" id="penalty-box">
        <span class="yellow-card" id="yellow-card">🟨</span>
        <span class="penalty-text">Time-out: <b id="penalty-countdown">2</b>s</span>
      </div>
      <div class="question-card">
        <div class="question-text" id="question-text">? × ?</div>
        <div class="choices" id="choices"></div>
      </div>
      <!-- For anyone racing for the top of the leaderboard: one early miss
           can already ruin a shot at a personal best, so restarting has to
           be available immediately, not just from a menu — feedback,
           2026-09-10, enlarged and moved below the question card the same
           day per direct follow-up ("put start over bigger make it at the
           bottom") since a small text link up by the timer read as too easy
           to miss/too easy to brush against by accident either way. -->
      <button class="restart-btn" id="restart-btn" type="button">↺ Start Over</button>
    </section>

    <!-- END SCREEN -->
    <section id="screen-end">
      <div class="card">
        <div class="trophy" id="end-trophy">🏆</div>
        <div class="final-title" id="final-title">Great game!</div>

        <div class="tally">
          <div class="tally-row">
            <span>🟨 Misses</span>
            <span class="val" id="tally-misses">0</span>
          </div>
          <hr class="tally-divider" />
          <div class="tally-row final">
            <span>🏁 FINAL SCORE</span>
            <span class="val" id="tally-final-score">0.0s</span>
          </div>
        </div>
        <div class="new-best hidden" id="new-best-badge">NEW PERSONAL BEST!</div>

        <div class="rank-reveal" id="rank-reveal"></div>

        <div class="name-entry" id="name-entry">
          <input id="name-input" type="text" maxlength="20" placeholder="Your name" autocomplete="off" />
          <button class="add-btn" id="add-to-leaderboard-btn" type="button">Add</button>
        </div>
        <button class="skip-link" id="skip-name-btn" type="button">No thanks</button>
        <div class="added-note" id="added-note"></div>

        <div class="leaderboard-wrap" id="end-leaderboard-wrap">
          <div class="leaderboard-title">🏆 Leaderboard</div>
          <div class="leaderboard-list" id="end-leaderboard-list"></div>
        </div>

        <div class="end-buttons">
          <button id="play-again-btn" type="button">Play Again</button>
          <button id="home-btn" type="button">Home</button>
        </div>
      </div>
    </section>

    <!-- LEADERBOARD-ONLY SCREEN -->
    <section id="screen-leaderboard">
      <div class="card">
        <div class="trophy">🏆</div>
        <div class="final-title">Leaderboard</div>
        <div class="leaderboard-wrap">
          <div class="leaderboard-list" id="standalone-leaderboard-list"></div>
        </div>
        <button id="back-from-leaderboard-btn" type="button">Back</button>
      </div>
    </section>
  </main>
</div>

<script>
(function () {
  'use strict';

  var SHOTS_PER_ROUND = 10;
  var MAX_TABLE = 12;
  // A miss costs time the natural way — the round simply pauses here for
  // real, with the live timer still running, rather than a number added to
  // the score afterward. This is the one source of truth for both the
  // pause duration and the on-screen countdown.
  var MISS_TIMEOUT_MS = 2000;
  var MAX_LEADERBOARD_ENTRIES = 100;
  var BEST_STORAGE_KEY = 'soccerMathBestTime_v1';
  var NAME_STORAGE_KEY = 'soccerMathLastName_v1';
  var LEADERBOARD_STORAGE_KEY = 'soccerMathLeaderboard_v1';
  // A little fun on first load, so the leaderboard never reads as an empty
  // dead end (and gives a real field to place yourself in from the very
  // first play): 20 real professional footballers, Messi on top and a
  // handful of other genuine superstars right behind him, tapering down
  // through well-known starters to a few deliberately obscure pros (real,
  // but names only an actual soccer fan would recognize) at the bottom —
  // the times are just for fun, not a real comment on anyone's ability.
  var SEED_LEADERBOARD = [
    { name: 'Messi', finalMs: 7800, misses: 0, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Cristiano Ronaldo', finalMs: 9100, misses: 0, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Kylian Mbappé', finalMs: 10400, misses: 0, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Erling Haaland', finalMs: 11600, misses: 0, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Kevin De Bruyne', finalMs: 13200, misses: 0, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Neymar Jr', finalMs: 14500, misses: 1, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Mohamed Salah', finalMs: 16800, misses: 1, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Jude Bellingham', finalMs: 19300, misses: 1, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Vinícius Júnior', finalMs: 22700, misses: 1, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Harry Kane', finalMs: 26100, misses: 2, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Toni Kroos', finalMs: 30500, misses: 2, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Luka Modrić', finalMs: 35000, misses: 2, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Antoine Griezmann', finalMs: 41200, misses: 3, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Bukayo Saka', finalMs: 48900, misses: 3, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Declan Rice', finalMs: 58300, misses: 4, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Virgil van Dijk', finalMs: 72000, misses: 5, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Thibaut Courtois', finalMs: 95000, misses: 6, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Jordan Pickford', finalMs: 125000, misses: 7, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Norberto Neto', finalMs: 160000, misses: 8, date: '2026-01-01T00:00:00.000Z' },
    { name: 'Danny Ward', finalMs: 180000, misses: 9, date: '2026-01-01T00:00:00.000Z' },
  ];

  var el = {
    screenStart: document.getElementById('screen-start'),
    screenGame: document.getElementById('screen-game'),
    screenEnd: document.getElementById('screen-end'),
    screenLeaderboard: document.getElementById('screen-leaderboard'),
    headerSub: document.getElementById('header-sub'),
    backBtn: document.getElementById('back-btn'),
    bestRow: document.getElementById('best-row'),
    recordRow: document.getElementById('record-row'),
    startBtn: document.getElementById('start-btn'),
    restartBtn: document.getElementById('restart-btn'),
    viewLeaderboardBtn: document.getElementById('view-leaderboard-btn'),
    backFromLeaderboardBtn: document.getElementById('back-from-leaderboard-btn'),
    shotTracker: document.getElementById('shot-tracker'),
    timerVal: document.getElementById('timer-val'),
    ballFly: document.getElementById('ball-fly'),
    resultBanner: document.getElementById('result-banner'),
    penaltyBox: document.getElementById('penalty-box'),
    yellowCard: document.getElementById('yellow-card'),
    penaltyCountdown: document.getElementById('penalty-countdown'),
    questionText: document.getElementById('question-text'),
    choices: document.getElementById('choices'),
    endTrophy: document.getElementById('end-trophy'),
    finalTitle: document.getElementById('final-title'),
    tallyMisses: document.getElementById('tally-misses'),
    tallyFinalScore: document.getElementById('tally-final-score'),
    newBestBadge: document.getElementById('new-best-badge'),
    rankReveal: document.getElementById('rank-reveal'),
    nameEntry: document.getElementById('name-entry'),
    nameInput: document.getElementById('name-input'),
    addToLeaderboardBtn: document.getElementById('add-to-leaderboard-btn'),
    skipNameBtn: document.getElementById('skip-name-btn'),
    addedNote: document.getElementById('added-note'),
    endLeaderboardWrap: document.getElementById('end-leaderboard-wrap'),
    endLeaderboardList: document.getElementById('end-leaderboard-list'),
    standaloneLeaderboardList: document.getElementById('standalone-leaderboard-list'),
    playAgainBtn: document.getElementById('play-again-btn'),
    homeBtn: document.getElementById('home-btn'),
  };

  var round = {
    shots: [], index: 0, misses: 0,
    answering: false, startTime: 0, elapsedMs: 0,
  };
  var timerInterval = null;
  var ballFlyResetTimeout = null;

  // ---------- storage ----------
  function loadBest() {
    try {
      var raw = localStorage.getItem(BEST_STORAGE_KEY);
      if (!raw) return { bestTimeMs: null };
      var parsed = JSON.parse(raw);
      return { bestTimeMs: typeof parsed.bestTimeMs === 'number' ? parsed.bestTimeMs : null };
    } catch (e) {
      return { bestTimeMs: null };
    }
  }
  function saveBest(best) {
    try { localStorage.setItem(BEST_STORAGE_KEY, JSON.stringify(best)); } catch (e) {}
  }
  function loadLeaderboard() {
    try {
      var raw = localStorage.getItem(LEADERBOARD_STORAGE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }
  function saveLeaderboard(entries) {
    entries.sort(function (a, b) { return a.finalMs - b.finalMs; });
    if (entries.length > MAX_LEADERBOARD_ENTRIES) entries = entries.slice(0, MAX_LEADERBOARD_ENTRIES);
    try { localStorage.setItem(LEADERBOARD_STORAGE_KEY, JSON.stringify(entries)); } catch (e) {}
    return entries;
  }
  function loadLastName() {
    try { return localStorage.getItem(NAME_STORAGE_KEY) || ''; } catch (e) { return ''; }
  }
  function saveLastName(name) {
    try { localStorage.setItem(NAME_STORAGE_KEY, name); } catch (e) {}
  }
  // Upserts by name rather than "only if the board is completely empty" —
  // that original check was the actual bug (2026-09-10): anyone who'd
  // already played and saved their own score before this feature shipped
  // had a non-empty board, so the seed rows silently never got added and
  // the leaderboard looked like it only had one person on it. This adds
  // whichever seed rows are missing (by name) and re-syncs their time if a
  // stale value from an earlier version of this file is still sitting in
  // localStorage — real players' own rows are never touched.
  function ensureSeedLeaderboard() {
    var board = loadLeaderboard();
    var changed = false;
    SEED_LEADERBOARD.forEach(function (seed) {
      var idx = board.findIndex(function (e) { return e.name === seed.name; });
      if (idx === -1) {
        board.push({ name: seed.name, finalMs: seed.finalMs, misses: seed.misses, date: seed.date });
        changed = true;
      } else if (board[idx].finalMs !== seed.finalMs) {
        board[idx] = { name: seed.name, finalMs: seed.finalMs, misses: seed.misses, date: seed.date };
        changed = true;
      }
    });
    if (changed) saveLeaderboard(board);
  }

  // ---------- helpers ----------
  function formatTime(ms) {
    var totalSeconds = ms / 1000;
    if (totalSeconds < 60) return totalSeconds.toFixed(1) + 's';
    var minutes = Math.floor(totalSeconds / 60);
    var seconds = totalSeconds - minutes * 60;
    return minutes + ':' + (seconds < 10 ? '0' : '') + seconds.toFixed(1);
  }
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
  function pick(arr) { return arr[randInt(0, arr.length - 1)]; }

  function renderBestRow(container) {
    var best = loadBest();
    container.innerHTML = '';
    if (best.bestTimeMs == null) return;
    var p1 = document.createElement('div');
    p1.className = 'pill';
    p1.textContent = 'Your Best: ' + formatTime(best.bestTimeMs);
    container.appendChild(p1);
  }

  function renderRecordRow() {
    var board = loadLeaderboard();
    el.recordRow.innerHTML = '';
    if (board.length === 0) return;
    var top = board[0];
    var span = document.createElement('div');
    span.className = 'record-pill';
    span.textContent = '🏆 Record: ' + formatTime(top.finalMs) + ' — ' + top.name;
    el.recordRow.appendChild(span);
  }

  // ---------- question generation ----------
  function buildShots() {
    var shots = [];
    for (var i = 0; i < SHOTS_PER_ROUND; i++) {
      var a = randInt(1, MAX_TABLE);
      var b = randInt(1, MAX_TABLE);
      shots.push({ a: a, b: b, answer: a * b, result: null });
    }
    return shots;
  }

  function buildChoices(correct) {
    var options = new Set([correct]);
    var attempts = 0;
    while (options.size < 4 && attempts < 40) {
      attempts++;
      var delta = pick([-3, -2, -1, 1, 2, 3, 4, -4]);
      var candidate = correct + delta * randInt(1, MAX_TABLE);
      if (candidate < 0) candidate = correct + Math.abs(delta);
      if (candidate !== correct && candidate >= 0) options.add(candidate);
    }
    while (options.size < 4) options.add(correct + options.size + 1);
    var arr = Array.from(options);
    for (var i = arr.length - 1; i > 0; i--) {
      var j = randInt(0, i);
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function renderShotTracker() {
    el.shotTracker.innerHTML = '';
    for (var i = 0; i < round.shots.length; i++) {
      var dot = document.createElement('div');
      var r = round.shots[i].result;
      dot.className = 'shot-dot' + (r === 'goal' ? ' goal' : r === 'miss' ? ' miss' : '') + (i === round.index ? ' current' : '');
      dot.textContent = r === 'goal' ? '✓' : r === 'miss' ? '✕' : '';
      el.shotTracker.appendChild(dot);
    }
  }

  function showScreen(name) {
    el.screenStart.style.display = name === 'start' ? 'block' : 'none';
    el.screenGame.style.display = name === 'game' ? 'flex' : 'none';
    el.screenEnd.style.display = name === 'end' ? 'block' : 'none';
    el.screenLeaderboard.style.display = name === 'leaderboard' ? 'block' : 'none';
  }

  // ---------- timer ----------
  function startTimer() {
    round.startTime = performance.now();
    el.timerVal.textContent = '0.0s';
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(function () {
      el.timerVal.textContent = formatTime(performance.now() - round.startTime);
    }, 100);
  }
  function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }

  // ---------- miss penalty (yellow card + real countdown) ----------
  var penaltyInterval = null;
  function showMissPenalty() {
    el.penaltyBox.classList.remove('hidden');
    // Restart the card's pop-in animation on every miss, not just the first
    // — re-triggering a CSS animation needs a reflow between removing and
    // re-applying it, since just re-adding the same class is a no-op.
    el.yellowCard.style.animation = 'none';
    void el.yellowCard.offsetWidth;
    el.yellowCard.style.animation = '';

    var secondsLeft = MISS_TIMEOUT_MS / 1000;
    el.penaltyCountdown.textContent = secondsLeft;
    if (penaltyInterval) clearInterval(penaltyInterval);
    penaltyInterval = setInterval(function () {
      secondsLeft--;
      if (secondsLeft > 0) el.penaltyCountdown.textContent = secondsLeft;
      else clearInterval(penaltyInterval);
    }, 1000);
  }
  function hidePenaltyBox() {
    if (penaltyInterval) { clearInterval(penaltyInterval); penaltyInterval = null; }
    el.penaltyBox.classList.add('hidden');
  }

  // ---------- round flow ----------
  // Bumped on every startRound() (including a mid-game "Start Over") and
  // captured by every in-flight setTimeout below — a stale timeout from an
  // abandoned round checks this before touching `round` at all, so
  // restarting mid-shootout can never let an old round's delayed callback
  // corrupt the new one's state (advancing its index, ending it early, etc).
  var currentRoundToken = 0;

  function startRound() {
    currentRoundToken++;
    if (ballFlyResetTimeout) { clearTimeout(ballFlyResetTimeout); ballFlyResetTimeout = null; }
    el.ballFly.className = 'ball-fly';
    round = {
      shots: buildShots(), index: 0, misses: 0, token: currentRoundToken,
      answering: false, startTime: 0, elapsedMs: 0,
    };
    el.headerSub.textContent = 'Score a goal for every right answer!';
    showScreen('game');
    startTimer();
    showQuestion();
  }

  // The celebration ball-fly animation is deliberately NOT reset here (it
  // used to be) — the next question now loads instantly on a correct
  // answer (see handleAnswer), and resetting the ball's class the moment
  // this runs would cut that CSS transition off before it's even visible.
  // celebrateGoal() below owns the ball's whole lifecycle independently,
  // including its own reset, so a fast answerer can chain goal after goal
  // with each celebration playing all the way through on its own schedule
  // (and confetti — see launchConfetti — already stacks the same way,
  // since every call appends its own independent, self-removing overlay).
  function showQuestion() {
    var shot = round.shots[round.index];
    round.answering = true;
    el.resultBanner.textContent = ' ';
    el.resultBanner.className = 'result-banner';
    hidePenaltyBox();
    el.questionText.textContent = shot.a + ' × ' + shot.b;
    renderShotTracker();

    var choices = buildChoices(shot.answer);
    el.choices.innerHTML = '';
    choices.forEach(function (val) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'choice-btn';
      btn.textContent = val;
      btn.addEventListener('click', function () { handleAnswer(val, btn, shot); });
      el.choices.appendChild(btn);
    });
  }

  // A wrong guess never reveals the right answer — it just costs a real
  // 2-second time-out (see showMissPenalty), then hands the SAME question
  // back for another guess, with only the choice(s) already tried crossed
  // off. This repeats for as many wrong guesses as it takes; only a correct
  // answer ever advances to the next shot. `startedForToken` guards every
  // deferred callback against a mid-round "Start Over" — see
  // currentRoundToken above.
  function handleAnswer(val, btn, shot) {
    if (!round.answering) return;
    round.answering = false;
    var startedForToken = round.token;
    var buttons = el.choices.querySelectorAll('.choice-btn');
    buttons.forEach(function (b) { b.disabled = true; });

    var correct = val === shot.answer;

    if (correct) {
      // Advances immediately — no artificial pause here. A fast answerer
      // shouldn't be capped by how long a celebration animation takes to
      // play; celebrateGoal()/launchConfetti() run entirely on their own
      // independent timers and keep playing (and stacking, for confetti)
      // regardless of how quickly the next question replaces this one.
      shot.result = 'goal';
      celebrateGoal();
      el.resultBanner.textContent = pick(['GOAL!! ⚽', 'ONTARGET! 🎉', 'SCORCHER! 🔥', 'TOP CORNER! ⚽']);
      el.resultBanner.classList.add('good');
      launchConfetti();
      renderShotTracker();

      round.index++;
      if (round.index >= round.shots.length) {
        round.elapsedMs = performance.now() - round.startTime;
        stopTimer();
        el.timerVal.textContent = formatTime(round.elapsedMs);
        endRound();
      } else {
        showQuestion();
      }
      return;
    }

    // Wrong: the picked choice is eliminated (stays disabled/marked so a
    // retry can't just re-click the same known-wrong answer) but nothing
    // says which of the rest is actually right — that's for them to work
    // out, same as a real missed penalty kick doesn't come with a hint.
    round.misses++;
    btn.classList.add('wrong');
    el.ballFly.className = 'ball-fly shoot-bad';
    el.resultBanner.textContent = pick(['SAVED! Take another shot ⚽', 'BLOCKED! Try again 🧤', 'OFF TARGET — go again ⚽']);
    el.resultBanner.classList.add('bad');
    showMissPenalty();

    setTimeout(function () {
      if (round.token !== startedForToken) return;
      hidePenaltyBox();
      el.ballFly.className = 'ball-fly';
      el.resultBanner.textContent = ' ';
      el.resultBanner.className = 'result-banner';
      round.answering = true;
      buttons.forEach(function (b) {
        if (!b.classList.contains('wrong')) b.disabled = false;
      });
    }, MISS_TIMEOUT_MS);
  }

  // Fires the ball-into-goal celebration and cleans itself up on its own
  // fixed schedule (matching the CSS transition's own 0.5s), independent
  // of however fast the next question loads. Force-restarts the CSS
  // transition (reset to the base class + a reflow before re-adding
  // shoot-good) so answering two goals in a row inside that ~550ms window
  // still replays the animation from the start rather than a no-op class
  // re-add being ignored.
  function celebrateGoal() {
    if (ballFlyResetTimeout) clearTimeout(ballFlyResetTimeout);
    el.ballFly.className = 'ball-fly';
    void el.ballFly.offsetWidth;
    el.ballFly.className = 'ball-fly shoot-good';
    ballFlyResetTimeout = setTimeout(function () {
      ballFlyResetTimeout = null;
      el.ballFly.className = 'ball-fly';
    }, 550);
  }

  function launchConfetti() {
    var wrap = document.createElement('div');
    wrap.className = 'confetti';
    var pieces = ['⚽', '🎉', '⭐', '🏆'];
    for (var i = 0; i < 10; i++) {
      var s = document.createElement('span');
      s.textContent = pick(pieces);
      s.style.left = randInt(4, 96) + '%';
      s.style.animationDuration = (0.9 + Math.random() * 0.6) + 's';
      s.style.animationDelay = (Math.random() * 0.15) + 's';
      wrap.appendChild(s);
    }
    document.body.appendChild(wrap);
    setTimeout(function () { wrap.remove(); }, 1800);
  }

  // ---------- end-of-round tally + leaderboard reveal ----------
  var tallyTimers = [];
  function clearTallyTimers() {
    tallyTimers.forEach(function (id) { clearTimeout(id); });
    tallyTimers = [];
  }

  // Animates a number counting up from 0 to `target` (ms) over `duration`ms,
  // using an ease-out curve so it starts fast and settles — the "totaling
  // it up" effect. Calls onDone once it lands exactly on target.
  function animateCount(targetEl, targetMs, duration, onDone) {
    var start = performance.now();
    function frame(now) {
      var t = Math.min(1, (now - start) / duration);
      var eased = 1 - Math.pow(1 - t, 3);
      targetEl.textContent = formatTime(targetMs * eased);
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        targetEl.textContent = formatTime(targetMs);
        if (onDone) onDone();
      }
    }
    requestAnimationFrame(frame);
  }

  // No penalty math happens here anymore — every miss already spent its
  // 2 seconds live, during the round (see showMissPenalty/MISS_TIMEOUT_MS
  // above), so `finalMs` is just the real elapsed time. This just counts up
  // to it for the "cool graphic" effect and shows how many misses happened,
  // as information, not arithmetic.
  function runTally(finalMs) {
    clearTallyTimers();
    el.tallyMisses.textContent = round.misses + (round.misses > 0 ? ' 🟨' : '');
    el.tallyFinalScore.textContent = '0.0s';
    el.rankReveal.className = 'rank-reveal';
    el.rankReveal.textContent = '';
    el.nameEntry.className = 'name-entry';
    el.skipNameBtn.className = 'skip-link';
    el.addedNote.className = 'added-note';
    el.endLeaderboardWrap.className = 'leaderboard-wrap';

    animateCount(el.tallyFinalScore, finalMs, 650, function () {
      tallyTimers.push(setTimeout(function () { revealRankAndLeaderboard(finalMs); }, 450));
    });
  }

  function revealRankAndLeaderboard(finalMs) {
    var board = loadLeaderboard();
    var previewRank = board.filter(function (e) { return e.finalMs <= finalMs; }).length + 1;
    el.rankReveal.innerHTML = board.length === 0
      ? 'Be the first on the <span class="big">Leaderboard!</span>'
      : 'That would rank <span class="big">#' + previewRank + '</span> of ' + (board.length + 1) + '!';
    el.rankReveal.classList.add('show');

    el.nameInput.value = loadLastName();
    el.nameEntry.classList.add('show');
    el.skipNameBtn.classList.add('show');
    renderLeaderboardList(el.endLeaderboardList, board, null);
    el.endLeaderboardWrap.classList.add('show');
  }

  function renderLeaderboardList(container, entries, highlightIndex) {
    container.innerHTML = '';
    if (entries.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'lb-empty';
      empty.textContent = 'No times yet — be the first to post one!';
      container.appendChild(empty);
      return;
    }
    entries.forEach(function (entry, i) {
      var row = document.createElement('div');
      row.className = 'lb-row' + (i === highlightIndex ? ' me pulse' : '');
      var rank = document.createElement('div');
      rank.className = 'lb-rank';
      rank.textContent = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i + 1);
      var name = document.createElement('div');
      name.className = 'lb-name';
      name.textContent = entry.name;
      var time = document.createElement('div');
      time.className = 'lb-time';
      time.textContent = formatTime(entry.finalMs);
      row.appendChild(rank);
      row.appendChild(name);
      row.appendChild(time);
      if (i === highlightIndex) row.id = 'lb-me-row';
      container.appendChild(row);
    });
  }

  function addCurrentScoreToLeaderboard(finalMs) {
    var name = (el.nameInput.value || '').trim() || 'Player';
    saveLastName(name);
    var board = loadLeaderboard();
    board.push({ name: name, finalMs: finalMs, misses: round.misses, date: new Date().toISOString() });
    board = saveLeaderboard(board);
    var myIndex = board.findIndex(function (e) {
      return e.name === name && e.finalMs === finalMs && e.misses === round.misses;
    });

    el.nameEntry.classList.remove('show');
    el.skipNameBtn.classList.remove('show');
    el.addedNote.textContent = myIndex >= 0 ? 'Added! You’re #' + (myIndex + 1) + ' on the board 🎉' : 'Added to the leaderboard!';
    el.addedNote.classList.add('show');

    renderLeaderboardList(el.endLeaderboardList, board, myIndex);
    if (myIndex >= 0) {
      setTimeout(function () {
        var row = document.getElementById('lb-me-row');
        if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 150);
    }
  }

  function endRound() {
    // finalMs is just the real elapsed time — every miss already cost its
    // 2 seconds live, during the round (see showMissPenalty above), so
    // there's nothing left to add here.
    var finalMs = round.elapsedMs;

    var best = loadBest();
    var isNewBest = best.bestTimeMs == null || finalMs < best.bestTimeMs;
    saveBest({ bestTimeMs: best.bestTimeMs == null ? finalMs : Math.min(best.bestTimeMs, finalMs) });

    var title, trophy;
    if (round.misses === 0) { title = 'FLAWLESS SHOOTOUT! Not a single miss!'; trophy = '🏆'; }
    else if (round.misses <= 2) { title = 'Great game — sharp shooting!'; trophy = '⭐'; }
    else if (round.misses <= 5) { title = 'Nice hustle out there!'; trophy = '⚽'; }
    else { title = 'Keep practicing — you’ll get there!'; trophy = '👟'; }
    el.finalTitle.textContent = title;
    el.endTrophy.textContent = trophy;
    el.newBestBadge.classList.toggle('hidden', !isNewBest);

    showScreen('end');
    runTally(finalMs);
    if (round.misses === 0) launchConfetti();

    el.addToLeaderboardBtn.onclick = function () { addCurrentScoreToLeaderboard(finalMs); };
  }

  // ---------- wiring ----------
  el.startBtn.addEventListener('click', startRound);
  el.restartBtn.addEventListener('click', startRound);
  el.playAgainBtn.addEventListener('click', function () {
    clearTallyTimers();
    startRound();
  });
  el.homeBtn.addEventListener('click', function () {
    clearTallyTimers();
    renderBestRow(el.bestRow);
    renderRecordRow();
    showScreen('start');
  });
  el.viewLeaderboardBtn.addEventListener('click', function () {
    renderLeaderboardList(el.standaloneLeaderboardList, loadLeaderboard(), null);
    showScreen('leaderboard');
  });
  el.backFromLeaderboardBtn.addEventListener('click', function () {
    showScreen('start');
  });
  el.nameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') el.addToLeaderboardBtn.click();
  });
  el.skipNameBtn.addEventListener('click', function () {
    el.nameEntry.classList.remove('show');
    el.skipNameBtn.classList.remove('show');
  });
  // Mirrors a real IonBackButton's own defaultHref fallback: go back to
  // wherever this tab actually came from (the app's Labs page, most often)
  // when there's real history to return to, otherwise this was opened
  // directly (a bookmark, a shared link) and there's nothing to go back
  // to, so land on the app root instead.
  el.backBtn.addEventListener('click', function () {
    if (window.history.length > 1) window.history.back();
    else window.location.href = '/';
  });

  ensureSeedLeaderboard();
  renderBestRow(el.bestRow);
  renderRecordRow();
  showScreen('start');
})();
</script>
</body>
</html>
