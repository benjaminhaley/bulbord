<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Tracker</title>
<!--
  Tracker lab (see labs/tracker/README.md). Deliberately standalone: plain
  HTML/JS, no build step, no imports from the app in web/src. Its only links
  to Bulbord are (1) reading the member's session token from the same
  localStorage key the app uses, and (2) the API's sandboxed /labs/tracker
  routes. Nothing in the app depends on this file.
-->
<style>
  :root {
    --bg: #f4f4f6;
    --card: #ffffff;
    --ink: #1c1b1f;
    --muted: #6b6b70;
    --line: #e2e2e6;
    --bar: #2c2c2c;
    --bar-ink: #ffffff;
    --red: #c62828;
    --red-bg: #fdecec;
    --green: #2e7d32;
    --accent: #3f51b5;
    --amber: #ef8f00;
    --track: #e8e8ec;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Roboto, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 1;
    background: var(--bar); color: var(--bar-ink);
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
    display: flex; align-items: center; gap: 12px;
  }
  header a { color: var(--bar-ink); text-decoration: none; font-size: 0.9375rem; opacity: 0.85; }
  header h1 { margin: 0; font-size: 1.125rem; font-weight: 500; flex: 1; }
  .icon-btn { background: none; border: 0; padding: 8px; margin: -8px 0; border-radius: 50%; cursor: pointer; color: var(--muted); display: inline-flex; }
  .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
  header .icon-btn { color: var(--bar-ink); margin-right: -8px; }
  header .icon-btn svg { width: 28px; height: 28px; }
  main { max-width: 480px; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 32px); }
  .intro { color: var(--muted); font-size: 0.875rem; margin: 0 0 16px; }
  .card {
    background: var(--card); border-radius: 12px; margin-bottom: 12px;
    border-left: 6px solid var(--green);
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    position: relative;
  }
  .card.due { border-left-color: var(--red); background: var(--red-bg); }
  /* A goal: one line (a red or green bar, the title, the score ring) that
     expands in place into the details. */
  .card.goal { margin-bottom: 8px; }
  .card.goal.open { background: var(--card); }
  .goal-row { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; padding: 8px 12px 8px 16px; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
  .goal-row .name { flex: 1; min-width: 0; font-size: 1rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.due .goal-row .name { color: var(--red); }
  .card.open .goal-row .name { white-space: normal; }
  .goal-body { padding: 4px 16px 16px; border-top: 1px solid var(--line); }
  .goal-body .description { font-size: 0.9375rem; color: var(--muted); margin: 10px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .why { font-size: 0.9375rem; margin-top: 10px; }
  .why b { font-weight: 500; margin-right: 4px; }
  .why b.red { color: var(--red); }
  .why b.green { color: var(--green); }
  .goal-body h3 { font-size: 0.8125rem; font-weight: 500; letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .goal-body form { display: grid; gap: 10px; margin-top: 14px; }
  .goal-body form.inline { padding: 0; }
  .goal-foot { display: flex; gap: 8px; margin-top: 16px; padding-top: 8px; border-top: 1px solid var(--line); }
  .donut { position: relative; flex: none; width: 40px; height: 40px; display: inline-grid; place-items: center; }
  .donut svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .donut span { position: relative; font-size: 0.6875rem; font-weight: 500; }
  label { font-size: 0.75rem; color: var(--muted); display: grid; gap: 4px; }
  input[type=date], input[type=text], input[type=number], textarea, select {
    font: inherit; font-size: 1rem; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink); width: 100%;
  }
  input[type=number] { width: 6em; }
  textarea { resize: vertical; min-height: 4.5em; }
  input[type=date] { display: block; min-width: 0; max-width: 100%; -webkit-appearance: none; appearance: none; text-align: left; min-height: 44px; }
  input[type=date]::-webkit-date-and-time-value { text-align: left; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { font: inherit; font-size: 0.875rem; font-weight: 500; border-radius: 20px; padding: 8px 16px; border: 0; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.text { background: none; color: var(--accent); padding: 8px 8px; }
  .btn.outline { background: none; color: var(--accent); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.kept { background: var(--green); color: #fff; }
  .btn.missed { background: var(--red); color: #fff; }
  .btn.danger { background: none; color: var(--red); padding: 8px 8px; }
  .btn:disabled { opacity: 0.5; }
  form.inline { padding: 14px 16px; display: grid; gap: 10px; }
  .card.new { border-left-color: var(--accent); }
  .msg { text-align: center; color: var(--muted); padding: 40px 16px; }
  .msg a { color: var(--accent); }
  .error { color: var(--red); font-size: 0.875rem; }
  .choices { display: grid; gap: 6px; }
  .choices label { display: flex; gap: 8px; align-items: flex-start; font-size: 0.9375rem; color: var(--ink); }
  .choices small { display: block; color: var(--muted); font-size: 0.8125rem; }
  .field-label { font-size: 0.75rem; color: var(--muted); }
  .weekdays { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .weekdays label { display: flex; gap: 4px; align-items: center; font-size: 0.9375rem; color: var(--ink); }
  [hidden] { display: none !important; }
  .history { list-style: none; margin: 0; padding: 0; }
  .history li { display: flex; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .history li:first-child { border-top: 0; }
  .history .body { flex: 1; min-width: 0; }
  .history .date { font-size: 0.9375rem; font-weight: 500; }
  .history .date span { font-weight: 400; color: var(--muted); font-size: 0.8125rem; margin-left: 6px; }
  .history .date span.future { color: var(--green); }
  .history .date span.unrecorded { color: var(--red); }
  .history .icon-btn { margin: -4px 0; }
  .empty { color: var(--muted); font-size: 0.875rem; margin: 0; }
</style>
</head>
<body>
<header>
  <a href="/labs" aria-label="Back to Labs">‹ Labs</a>
  <h1>Tracker</h1>
  <button class="icon-btn" id="add-btn" type="button" aria-label="Add a goal" hidden><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
</header>
<main>
  <p class="intro">Red means there's something you can do today. The ring is your score for the last 8 weeks.</p>
  <div id="list"><p class="msg">Loading…</p></div>
</main>
<script>
(function () {
  var API = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? 'http://' + location.hostname + ':' + (localStorage.getItem('labsApiPort') || '3001')
    : 'https://api-production-a551.up.railway.app'
  var BASE = API + '/labs/tracker'
  var token = null
  try { token = localStorage.getItem('bulbord_session_token') } catch (e) {}

  var listEl = document.getElementById('list')
  var addBtn = document.getElementById('add-btn')
  var goals = []
  var adding = false
  var openId = null // the expanded goal
  var editing = false // the expanded goal is showing its edit form

  // Mirrors lab.ts.
  var WINDOW_DAYS = 56 // the score covers the last 8 weeks
  var MAX_STALE_DAYS = 3650
  var DEFAULT_STALE_DAYS = 14
  var WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
  var PERIODS = [[7, 'Every week'], [14, 'Every 2 weeks'], [28, 'Every 4 weeks']]

  var ICONS = {
    trash: 'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z',
  }
  function iconButton(icon, label, onclick) {
    var b = el('button', { class: 'icon-btn', type: 'button', 'aria-label': label, title: label, onclick: onclick })
    b.innerHTML = '<svg viewBox="0 0 24 24"><path d="' + ICONS[icon] + '"/></svg>'
    return b
  }

  function api(method, path, body) {
    return fetch(BASE + path, {
      method: method,
      headers: Object.assign({ Authorization: 'Bearer ' + token }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined,
    }).then(function (res) {
      return res.json().catch(function () { return {} }).then(function (json) {
        if (!res.ok) { var err = new Error((json.error && json.error.message) || 'Something went wrong'); err.status = res.status; throw err }
        return json
      })
    })
  }

  function pad(n) { return (n < 10 ? '0' : '') + n }
  function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) }
  function todayIso() { return isoOf(new Date()) }
  function parseIso(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]) }
  function daysAgoIso(n) { var d = new Date(); d.setDate(d.getDate() - n); return isoOf(d) }
  // Whole days from today to iso: positive = future, negative = past.
  function daysFromToday(iso) { return Math.round((parseIso(iso) - parseIso(todayIso())) / 86400000) }
  function byName(a, b) { return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }) }
  function percent(n, of) { return Math.round((100 * n) / of) }

  // ---- Deriving each goal's state from its entries (viewer's time zone) ----
  // Entries come from the API newest date first.

  // The next one is the soonest entry dated today or later.
  function nextEntry(goal) {
    var today = todayIso()
    for (var i = goal.entries.length - 1; i >= 0; i--) if (goal.entries[i].date >= today) return goal.entries[i]
    return null
  }
  // Entries that have happened: before today for a plan (today's is still the
  // next one), up to and including today otherwise.
  function pastEntries(goal) {
    var today = todayIso()
    return goal.entries.filter(function (e) { return goal.type === 'plan' ? e.date < today : e.date <= today })
  }
  // How many of the last 8 weeks' periods (counted back from today) had an
  // entry dated today or earlier; `explain(n, periods)` says it in words.
  function periodScore(goal, periodDays, explain) {
    var periods = WINDOW_DAYS / periodDays, hit = {}
    goal.entries.forEach(function (e) {
      var ago = -daysFromToday(e.date)
      if (ago >= 0 && ago < WINDOW_DAYS) hit[Math.floor(ago / periodDays)] = true
    })
    var n = Object.keys(hit).length
    return { value: percent(n, periods), detail: explain(n, periods) }
  }
  // A check-in goal's chosen days in the last 8 weeks, newest first, each with
  // its record (if any). Today is included but never counts as missing.
  function checkinDays(goal) {
    var byDate = {}
    goal.entries.forEach(function (e) { byDate[e.date] = byDate[e.date] || e })
    var days = []
    for (var ago = 0; ago < WINDOW_DAYS; ago++) {
      var iso = daysAgoIso(ago)
      if (goal.weekdays.indexOf(parseIso(iso).getDay()) !== -1) days.push({ date: iso, ago: ago, entry: byDate[iso] || null })
    }
    return days
  }
  function unrecorded(goal) { return checkinDays(goal).filter(function (d) { return !d.entry && d.ago > 0 }) }
  function projectAge(goal) {
    var last = pastEntries(goal)[0]
    return last ? -daysFromToday(last.date) : Infinity
  }

  // Everything that differs by goal type: what turns it red and why it is
  // red or green (`why`, one short line), the score and what it counts, the
  // type's setting, and the expanded card's contents.
  var TYPES = {
    plan: {
      label: 'Plan ahead',
      detail: 'Red until the next one is on the calendar. E.g. seeing friends, a date night.',
      isDue: function (goal) { return !nextEntry(goal) },
      why: function (goal) { return nextEntry(goal) ? 'the next one is planned.' : 'nothing is planned. Add the next one below.' },
      score: function (goal) {
        var stretch = { 7: 'weeks', 14: 'two-week stretches', 28: 'four-week stretches' }[goal.period_days]
        return periodScore(goal, goal.period_days, function (n, of) { return n + ' of the last ' + of + ' ' + stretch + ' had one.' })
      },
      settingField: function (goal) {
        var select = el('select', { 'aria-label': 'How often' }, PERIODS.map(function (p) {
          var option = el('option', { value: String(p[0]), text: p[1] })
          option.selected = (goal ? goal.period_days : 7) === p[0]
          return option
        }))
        return { node: el('label', {}, ['How often should one happen?', select]), read: function () { return { period_days: Number(select.value) } } }
      },
      body: function (goal) {
        var next = nextEntry(goal)
        return [
          entryForm(goal, 'Note (optional)', false),
          next ? el('h3', { text: 'Next one' }) : null,
          next ? entryList([next]) : null,
          historySection(pastEntries(goal)),
        ]
      },
    },
    progress: {
      label: 'Keep making progress',
      detail: 'Red once it’s been too many days since you last worked on it. E.g. a project.',
      isDue: function (goal) { return projectAge(goal) > goal.stale_days },
      why: function (goal) {
        var last = pastEntries(goal)[0]
        if (!last) return 'no progress logged yet.'
        var since = last.date === todayIso() ? 'progress today' : 'last progress ' + relLabel(last.date)
        return since + '; red after ' + goal.stale_days + ' days without any.'
      },
      score: function (goal) { return periodScore(goal, 7, function (n, of) { return 'progress in ' + n + ' of the last ' + of + ' weeks.' }) },
      settingField: function (goal) {
        var input = el('input', { type: 'number', min: '1', max: String(MAX_STALE_DAYS), inputmode: 'numeric', value: String(goal ? goal.stale_days : DEFAULT_STALE_DAYS), 'aria-label': 'Days' })
        return {
          node: el('label', {}, ['Days without progress before it turns red', input]),
          read: function () {
            var days = Number(input.value)
            if (!Number.isInteger(days) || days < 1 || days > MAX_STALE_DAYS) throw new Error('Days must be a whole number from 1 to ' + MAX_STALE_DAYS)
            return { stale_days: days }
          },
        }
      },
      body: function (goal) {
        return [entryForm(goal, 'What did you do? (optional)', true), historySection(pastEntries(goal))]
      },
    },
    checkin: {
      label: 'Check in on set days',
      detail: 'Record each chosen day as kept or missed; red while a day in the last 8 weeks is unrecorded. E.g. no drinking on Sundays and Mondays.',
      isDue: function (goal) { return unrecorded(goal).length > 0 },
      why: function (goal) {
        var missing = unrecorded(goal).length, days = goal.weekdays.map(function (d) { return WEEKDAYS[d] }).join('/')
        return missing
          ? missing + (missing === 1 ? ' past ' + days + ' isn’t' : ' past ' + days + ' days aren’t') + ' recorded yet. Record them below.'
          : 'every ' + days + ' in the last 8 weeks is recorded.'
      },
      score: function (goal) {
        var counted = checkinDays(goal).filter(function (d) { return d.ago > 0 || d.entry })
        var kept = counted.filter(function (d) { return d.entry && d.entry.outcome === 'kept' }).length
        return counted.length ? { value: percent(kept, counted.length), detail: kept + ' of ' + counted.length + ' days kept; an unrecorded day counts as missed.' } : null
      },
      settingField: function (goal) {
        var boxes = WEEKDAYS.map(function (name, day) {
          return el('input', { type: 'checkbox', value: String(day), checked: goal ? goal.weekdays.indexOf(day) !== -1 : false })
        })
        return {
          node: el('div', { class: 'choices' }, [
            el('div', { class: 'field-label', text: 'Which days?' }),
            el('div', { class: 'weekdays' }, boxes.map(function (box, day) { return el('label', {}, [box, WEEKDAYS[day]]) })),
          ]),
          read: function () {
            var days = boxes.filter(function (b) { return b.checked }).map(function (b) { return Number(b.value) })
            if (!days.length) throw new Error('Pick at least one day of the week')
            return { weekdays: days }
          },
        }
      },
      body: function (goal) {
        return [el('h3', { text: 'Last 8 weeks' }), checkinList(goal)]
      },
    },
  }

  function isDue(goal) { return TYPES[goal.type].isDue(goal) }

  // Lists show the full date, year included when it isn't this one.
  function fullDateLabel(iso) {
    var d = parseIso(iso)
    var opts = { weekday: 'short', month: 'short', day: 'numeric' }
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric'
    return d.toLocaleDateString(undefined, opts)
  }
  function relLabel(iso) {
    var days = daysFromToday(iso)
    if (days === 0) return 'today'
    if (days === 1) return 'tomorrow'
    if (days === -1) return 'yesterday'
    var n = Math.abs(days), span
    if (n < 14) span = n + ' days'
    else if (n < 60) span = Math.round(n / 7) + ' weeks'
    else if (n < 730) span = Math.round(n / 30) + ' months'
    else span = Math.round(n / 365) + ' years'
    return days > 0 ? 'in ' + span : span + ' ago'
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag)
    for (var k in attrs || {}) {
      if (k === 'text') node.textContent = attrs[k]
      else if (k === 'value') node.value = attrs[k]
      else if (k === 'checked') node.checked = !!attrs[k]
      else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), attrs[k])
      else if (attrs[k] !== false && attrs[k] != null) node.setAttribute(k, attrs[k] === true ? '' : attrs[k])
    }
    ;(children || []).forEach(function (c) { if (c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c) })
    return node
  }

  function render() {
    listEl.innerHTML = ''
    if (adding) listEl.appendChild(renderGoalForm(null))
    if (goals.length === 0 && !adding) listEl.appendChild(el('p', { class: 'msg', text: 'No goals yet — tap + to add one.' }))
    sortedGoals().forEach(function (goal) { listEl.appendChild(renderGoal(goal)) })
    addBtn.hidden = false
  }

  // Green first (upcoming plans soonest at the top), then the red ones,
  // alphabetically.
  function sortedGoals() {
    var ranked = goals.map(function (goal) {
      var next = goal.type === 'plan' ? nextEntry(goal) : null
      return { goal: goal, rank: isDue(goal) ? 2 : next ? 0 : 1, next: next ? next.date : '' }
    })
    ranked.sort(function (a, b) {
      if (a.rank !== b.rank) return a.rank - b.rank
      if (a.next !== b.next) return a.next < b.next ? -1 : 1
      return byName(a.goal, b.goal)
    })
    return ranked.map(function (r) { return r.goal })
  }

  // "Add a goal" (goal null: pick the type first; shown atop the list) and
  // "edit this goal" (in its expanded card: title, description and the
  // type's setting; the type is fixed).
  function renderGoalForm(goal) {
    var type = goal ? goal.type : 'plan'
    var nameInput = el('input', { type: 'text', maxlength: '80', placeholder: 'e.g. See friends', value: goal ? goal.name : '', 'aria-label': 'Title' })
    var descInput = el('textarea', { maxlength: '500', rows: '3', placeholder: 'e.g. I want to hang out with good friends more', 'aria-label': 'Description' })
    descInput.value = goal ? goal.description : ''
    var settingWrap = el('div', {})
    var setting
    function showSetting() {
      setting = TYPES[type].settingField(goal)
      settingWrap.innerHTML = ''
      settingWrap.appendChild(setting.node)
    }
    showSetting()
    var types = goal ? null : el('div', { class: 'choices' }, Object.keys(TYPES).map(function (key) {
      return el('label', {}, [
        el('input', { type: 'radio', name: 'type', value: key, checked: type === key, onchange: function () { type = key; showSetting() } }),
        el('span', {}, [TYPES[key].label, el('small', { text: TYPES[key].detail })]),
      ])
    }))
    var errorEl = el('div', { class: 'error' })
    var save = el('button', { class: 'btn primary', type: 'submit', text: goal ? 'Save' : 'Add' })
    var cancel = el('button', { class: 'btn text', type: 'button', text: 'Cancel', onclick: function () { adding = false; editing = false; render() } })
    var form = el('form', { class: 'inline', onsubmit: function (e) {
      e.preventDefault()
      var body
      try {
        if (!nameInput.value.trim()) throw new Error('Give it a title')
        body = Object.assign({ name: nameInput.value, description: descInput.value }, setting.read())
      } catch (err) { errorEl.textContent = err.message; return }
      if (!goal) body.type = type
      save.disabled = cancel.disabled = true
      ;(goal ? api('PATCH', '/items/' + goal.id, body) : api('POST', '/items', body))
        .then(function () { adding = false; editing = false; return load() })
        .catch(function (err) { errorEl.textContent = err.message; save.disabled = cancel.disabled = false })
    } }, [
      goal ? null : el('label', { text: 'New goal' }),
      types,
      el('label', {}, ['Title', nameInput]),
      el('label', {}, ['Description', descInput]),
      settingWrap,
      errorEl,
      el('div', { class: 'row' }, [save, cancel]),
    ])
    setTimeout(function () { nameInput.focus() }, 0)
    return goal ? form : el('div', { class: 'card new' }, [form])
  }

  // One line per goal: a red or green bar, the title and the score ring.
  // Tapping the line expands the card in place, the line staying on top as
  // its header; tapping it again folds it back.
  function renderGoal(goal) {
    var open = openId === goal.id
    var score = TYPES[goal.type].score(goal)
    return el('div', { class: 'card goal' + (isDue(goal) ? ' due' : '') + (open ? ' open' : '') }, [
      el('button', { class: 'goal-row', type: 'button', 'aria-expanded': String(open), onclick: function () {
        openId = open ? null : goal.id
        editing = false
        render()
      } }, [el('span', { class: 'name', text: goal.name }), donut(score)]),
      open ? el('div', { class: 'goal-body' }, editing ? [renderGoalForm(goal)] : goalDetails(goal, score)) : null,
    ])
  }

  // First, plainly: why it's red or green, and what the score counts. Then
  // the type's own contents, then Edit / Delete.
  function goalDetails(goal, score) {
    var type = TYPES[goal.type], due = isDue(goal)
    return [
      goal.description ? el('p', { class: 'description', text: goal.description }) : null,
      el('div', { class: 'why' }, [el('b', { class: due ? 'red' : 'green', text: due ? 'Red —' : 'Green —' }), type.why(goal)]),
      el('div', { class: 'why' }, [el('b', { text: score ? 'Score ' + score.value + '% —' : 'Score —' }), score ? score.detail : 'nothing to score yet.']),
    ].concat(type.body(goal)).concat([
      el('div', { class: 'goal-foot' }, [
        el('button', { class: 'btn text', type: 'button', text: 'Edit goal', onclick: function () { editing = true; render() } }),
        el('button', { class: 'btn danger', type: 'button', text: 'Delete goal', onclick: function () {
          if (!confirm('Delete the "' + goal.name + '" goal?')) return
          api('DELETE', '/items/' + goal.id).then(function () { openId = null; return load() }).catch(function (err) { alert(err.message) })
        } }),
      ]),
    ])
  }

  // The score as a ring, filled to the percent and colored by how good it is
  // (green from 75%, amber from 40%, red below). Empty when there's nothing
  // to score yet.
  function donut(score) {
    var v = score ? score.value : 0
    var color = v >= 75 ? 'var(--green)' : v >= 40 ? 'var(--amber)' : 'var(--red)'
    var ring = function (stroke, extra) { return '<circle cx="18" cy="18" r="15.9155" fill="none" stroke-width="4" stroke="' + stroke + '"' + (extra || '') + '/>' }
    var node = el('span', { class: 'donut', role: 'img', 'aria-label': score ? 'Score ' + v + '%' : 'No score yet' })
    node.innerHTML = '<svg viewBox="0 0 36 36">' + ring('var(--track)') +
      (v ? ring(color, ' stroke-dasharray="' + v + ' 100" transform="rotate(-90 18 18)"') : '') +
      '</svg><span>' + (score ? v + '%' : '–') + '</span>'
    return node
  }

  // Pick a date (today by default), an optional note, Add. For a plan the date
  // alone decides whether it's the next one or history, and the server makes
  // a new upcoming date replace the next one.
  function entryForm(goal, notePlaceholder, pastOnly) {
    var dateInput = el('input', { type: 'date', value: todayIso(), max: pastOnly ? todayIso() : null, 'aria-label': 'Date' })
    var noteInput = el('input', { type: 'text', maxlength: '200', placeholder: notePlaceholder, 'aria-label': 'Note' })
    var errorEl = el('div', { class: 'error' })
    var save = el('button', { class: 'btn primary', type: 'submit', text: 'Add' })
    return el('form', { onsubmit: function (e) {
      e.preventDefault()
      if (!dateInput.value) { errorEl.textContent = 'Pick a date'; return }
      save.disabled = true
      addEntry(goal, { date: dateInput.value, note: noteInput.value })
        .catch(function (err) { errorEl.textContent = err.message; save.disabled = false })
    } }, [dateInput, noteInput, errorEl, el('div', { class: 'row' }, [save])])
  }

  function addEntry(goal, body) {
    return api('POST', '/items/' + goal.id + '/entries', Object.assign({ today: todayIso() }, body)).then(load)
  }
  function deleteEntry(entry) {
    return api('DELETE', '/entries/' + entry.id).then(load).catch(function (err) { alert(err.message) })
  }

  function historySection(past) {
    return el('div', {}, [
      el('h3', { text: 'History' }),
      past.length ? entryList(past) : el('p', { class: 'empty', text: 'Nothing logged yet.' }),
    ])
  }

  function entryList(entries) {
    return el('ul', { class: 'history' }, entries.map(function (entry) {
      return el('li', {}, [
        el('div', { class: 'body' }, [
          el('div', { class: 'date' }, [fullDateLabel(entry.date), el('span', { class: daysFromToday(entry.date) > 0 ? 'future' : '', text: relLabel(entry.date) })]),
          entry.note ? el('div', { class: 'note', text: entry.note }) : null,
        ]),
        iconButton('trash', 'Delete this entry', function () {
          if (confirm('Delete the ' + fullDateLabel(entry.date) + ' entry?')) deleteEntry(entry)
        }),
      ])
    }))
  }

  // One row per chosen day in the last 8 weeks: Kept / Missed. Tapping the
  // chosen answer again clears it.
  function checkinList(goal) {
    return el('ul', { class: 'history' }, checkinDays(goal).map(function (day) {
      var outcome = day.entry && day.entry.outcome
      function answer(value, text) {
        return el('button', { class: 'btn ' + (outcome === value ? value : 'outline'), type: 'button', text: text, 'aria-pressed': String(outcome === value), onclick: function (e) {
          e.currentTarget.disabled = true
          ;(outcome === value ? deleteEntry(day.entry) : addEntry(goal, { date: day.date, outcome: value })).catch(function (err) { alert(err.message) })
        } })
      }
      return el('li', {}, [
        el('div', { class: 'body' }, [
          el('div', { class: 'date' }, [fullDateLabel(day.date), el('span', { class: outcome || day.ago === 0 ? '' : 'unrecorded', text: outcome ? relLabel(day.date) : day.ago === 0 ? 'today' : 'not recorded' })]),
        ]),
        answer('kept', 'Kept'),
        answer('missed', 'Missed'),
      ])
    }))
  }

  function showMessage(html) { listEl.innerHTML = '<p class="msg">' + html + '</p>'; addBtn.hidden = true }

  function load() {
    return api('GET', '/items').then(function (json) { goals = json.data; render() }).catch(function (err) {
      if (err.status === 401 || err.status === 403) showMessage('Sign in to Bulbord to use the tracker. <a href="/">Go to Bulbord</a>')
      else showMessage('Couldn’t load the tracker: ' + err.message.replace(/</g, '&lt;'))
    })
  }

  addBtn.addEventListener('click', function () {
    adding = true
    render()
    window.scrollTo(0, 0)
  })

  // Re-check red and the scores when coming back to the page (dates roll
  // over), unless a form is open (re-rendering would drop what's typed).
  window.addEventListener('pageshow', function (e) { if (e.persisted) load() })
  document.addEventListener('visibilitychange', function () { if (!document.hidden && token && goals.length && !adding && !openId) render() })

  if (!token) showMessage('Sign in to Bulbord to use the tracker. <a href="/">Go to Bulbord</a>')
  else load()
})()
</script>
</body>
</html>
