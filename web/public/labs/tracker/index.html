<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Tracker</title>
<!--
  Tracker lab (see labs/tracker/README.md). Deliberately standalone: plain
  HTML/JS, no build step, no imports from the app in web/src. Its only links
  to Bulbord are (1) reading the member's session token from the same
  localStorage key the app uses, and (2) the API's sandboxed /labs/tracker
  routes. Nothing in the app depends on this file.
-->
<style>
  :root {
    --bg: #f4f4f6;
    --card: #ffffff;
    --ink: #1c1b1f;
    --muted: #6b6b70;
    --line: #e2e2e6;
    --bar: #2c2c2c;
    --bar-ink: #ffffff;
    --red: #c62828;
    --red-bg: #fdecec;
    --green: #2e7d32;
    --green-bg: #edf6ee;
    --accent: #3f51b5;
    --track: #e8e8ec;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Roboto, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 1;
    background: var(--bar); color: var(--bar-ink);
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
    display: flex; align-items: center; gap: 12px;
  }
  header a { color: var(--bar-ink); text-decoration: none; font-size: 0.9375rem; opacity: 0.85; }
  header h1 { margin: 0; font-size: 1.125rem; font-weight: 500; flex: 1; }
  .icon-btn { background: none; border: 0; padding: 8px; margin: -8px 0; border-radius: 50%; cursor: pointer; color: var(--muted); display: inline-flex; }
  .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
  header .icon-btn { color: var(--bar-ink); margin-right: -8px; }
  header .icon-btn svg { width: 28px; height: 28px; }
  main { max-width: 480px; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 32px); }
  .card {
    background: var(--card); border-radius: 12px; margin-bottom: 12px;
    border-left: 6px solid var(--green);
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    position: relative;
  }
  .card.due { border-left-color: var(--red); background: var(--red-bg); }
  /* A goal: one line (a red or green bar, the title, the score ring) that
     expands in place into the details. */
  .card.goal { margin-bottom: 8px; }
  .card.goal.open { background: var(--card); }
  .goal-row { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; padding: 8px 12px 8px 16px; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
  button.goal-row { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .goal-row input.title-field { flex: 1; min-width: 0; padding: 4px 8px; margin-left: -8px; font-weight: 500; }
  .goal-row .name { flex: 1; min-width: 0; font-size: 1rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.due .goal-row .name { color: var(--red); }
  .card.open .goal-row .name { white-space: normal; }
  .goal-body { padding: 0 16px 8px 16px; display: grid; gap: 14px; }
  .goal-body.opening { animation: unfold 160ms ease-out; }
  @keyframes unfold { from { opacity: 0; transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .goal-body.opening { animation: none; } }
  textarea.note-field.description { color: var(--muted); }
  .goal-body form { display: grid; gap: 8px; }
  .goal-body form.inline { padding: 0; }
  /* Why it's red or green, and when that changes. */
  .status { display: flex; align-items: flex-start; gap: 8px; border-radius: 10px; padding: 10px 12px; background: var(--green-bg); }
  .status.due { background: var(--red-bg); }
  .status > div { flex: 1; min-width: 0; }
  .status .title { font-size: 0.9375rem; font-weight: 500; color: var(--green); }
  .status.due .title { color: var(--red); }
  .status .detail { font-size: 0.875rem; margin-top: 2px; overflow-wrap: anywhere; }
  .status .fields { margin-top: 4px; }
  /* Fields you tap to edit in place; they read as plain text until then. A
     date is its label under an invisible native date input, which takes the
     tap and opens the picker. */
  .date-field { position: relative; display: inline-block; padding: 2px 0; font-size: 0.875rem; border-bottom: 1px dashed var(--muted); }
  .date-field b { color: var(--ink); }
  .date-field span { color: var(--muted); margin-left: 6px; }
  .date-field input[type=date] { position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0; padding: 0; border: 0; opacity: 0; cursor: pointer; }
  .date-field input[type=date]::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
  .date-field.pick b { color: var(--accent); }
  .day-row .date-field.pick { display: inline-block; margin: 0; padding: 6px 12px; border: 0; border-radius: 20px; box-shadow: inset 0 0 0 1px var(--line); font-size: 0.8125rem; font-weight: 500; }
  .date-field.pick { display: block; margin-top: 8px; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; color: var(--accent); font-size: 1rem; font-weight: 500; text-align: center; }
  textarea.note-field { display: block; min-height: 0; padding: 2px 0; border: 0; border-bottom: 1px solid transparent; border-radius: 0; background: transparent; resize: none; overflow: hidden; }
  textarea.note-field:focus { outline: none; border-bottom-color: var(--accent); }
  .history-toggle { display: flex; align-items: center; gap: 6px; width: 100%; margin: -6px 0; padding: 6px 0; background: none; border: 0; color: var(--muted); font: inherit; font-size: 0.875rem; text-align: left; cursor: pointer; }
  .history-toggle svg { width: 16px; height: 16px; fill: currentColor; transition: transform 120ms; }
  .history-toggle[aria-expanded=true] svg { transform: rotate(90deg); }
  .history-toggle svg.gear { transform: none; }
  .settings { display: grid; gap: 12px; }
  /* What the score counts: one mark per period, oldest to newest. */
  .score-line { font-size: 0.875rem; margin-bottom: 6px; }
  .score-line b { font-weight: 400; color: var(--muted); }
  .marks { display: flex; gap: 3px; }
  .marks i { flex: 1; height: 8px; border-radius: 2px; background: var(--track); }
  .marks i.on { background: var(--green); }
  .marks i.kept { background: var(--green); }
  .marks i.missed { background: var(--red); }
  /* A check-in day: its date, then Kept / Missed to tap. */
  .day-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
  .day-row .when { flex: 1; min-width: 0; font-size: 0.875rem; }
  .day-row .question { flex: 1; min-width: 0; font-size: 0.9375rem; }
  .day-row .answers { display: flex; gap: 8px; }
  .question-setting { display: grid; gap: 4px; font-size: 0.875rem; }
  .question-input { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .question-input input { flex: 1; min-width: 0; }
  .day-row .question .note-field { margin-top: 2px; font-size: 0.8125rem; }
  .day-row .question .day-note { display: block; margin-top: 2px; }
  .history .body .day-note { display: block; color: var(--ink); font-size: 0.8125rem; overflow-wrap: anywhere; }
  .day-row .when .day-note { color: var(--ink); font-size: 0.8125rem; overflow-wrap: anywhere; }
  .note-dialog { width: min(440px, calc(100% - 32px)); border: 0; border-radius: 16px; padding: 16px; background: var(--card); color: var(--ink); }
  .note-dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
  .note-dialog textarea { width: 100%; box-sizing: border-box; }
  .note-dialog textarea:focus { outline: none; border-color: var(--accent); }
  .note-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
  .day-row .when span { display: block; color: var(--muted); font-size: 0.75rem; }
  .day-row .btn { padding: 6px 12px; font-size: 0.8125rem; background: var(--card); }
  .day-row .btn.kept { background: var(--green); }
  .day-row .btn.missed { background: var(--red); }
  .goal-foot { margin: -6px 0 0 -8px; }
  .goal-foot .btn.text { color: var(--muted); font-weight: 400; }
  /* The goal's setting, tap-to-change on the card. */
  .setting label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.875rem; }
  .setting select { width: auto; padding: 4px 0; border: 0; background: none; color: var(--accent); text-align: right; -webkit-appearance: none; appearance: none; }
  .setting input[type=number] { width: 3.5em; padding: 4px 8px; text-align: center; -moz-appearance: textfield; appearance: textfield; }
  .setting input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .setting .choices { gap: 4px; }
  .setting .field-label { font-size: 0.875rem; }
  .setting .weekdays { flex-wrap: nowrap; gap: 4px; }
  .setting .weekdays label { flex: 1; position: relative; justify-content: center; padding: 6px 0; border: 1px solid var(--line); border-radius: 8px; font-size: 0.8125rem; color: var(--muted); cursor: pointer; }
  .setting .weekdays label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #fff; }
  .setting .weekdays input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .donut { position: relative; flex: none; width: 40px; height: 40px; display: inline-grid; place-items: center; }
  .donut svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .donut span { position: relative; font-size: 0.6875rem; font-weight: 500; }
  label { font-size: 0.75rem; color: var(--muted); display: grid; gap: 4px; }
  input[type=date], input[type=text], input[type=number], textarea, select {
    font: inherit; font-size: 1rem; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink); width: 100%;
  }
  input[type=number] { width: 6em; }
  textarea { resize: vertical; min-height: 4.5em; }
  input[type=date] { display: block; min-width: 0; max-width: 100%; -webkit-appearance: none; appearance: none; text-align: left; min-height: 44px; }
  input[type=date]::-webkit-date-and-time-value { text-align: left; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { font: inherit; font-size: 0.875rem; font-weight: 500; border-radius: 20px; padding: 8px 16px; border: 0; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.text { background: none; color: var(--accent); padding: 8px 8px; }
  .btn.outline { background: none; color: var(--accent); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.kept { background: var(--green); color: #fff; }
  .btn.missed { background: var(--red); color: #fff; }
  .btn.danger { background: none; color: var(--red); padding: 8px 8px; margin-left: auto; }
  .btn:disabled { opacity: 0.5; }
  form.inline { padding: 14px 16px; display: grid; gap: 10px; }
  .card.new { border-left-color: var(--accent); }
  .msg { text-align: center; color: var(--muted); padding: 40px 16px; }
  .msg a { color: var(--accent); }
  .error { color: var(--red); font-size: 0.875rem; }
  .choices { display: grid; gap: 6px; }
  .choices label { display: flex; gap: 8px; align-items: flex-start; font-size: 0.9375rem; color: var(--ink); }
  .choices small { display: block; color: var(--muted); font-size: 0.8125rem; }
  .field-label { font-size: 0.75rem; color: var(--muted); }
  .weekdays { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .weekdays label { display: flex; gap: 4px; align-items: center; font-size: 0.9375rem; color: var(--ink); }
  [hidden] { display: none !important; }
  .history { list-style: none; margin: 0; padding: 0; }
  .history { margin-top: 4px; }
  .history li { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; }
  .history .body { flex: 1; min-width: 0; font-size: 0.9375rem; overflow-wrap: anywhere; }
  .add-past { margin-top: 6px; }
  .remove { flex: none; background: none; border: 0; padding: 4px; margin: -2px -4px -2px 0; color: #a0a0a6; cursor: pointer; display: inline-flex; }
  .remove svg { width: 18px; height: 18px; fill: currentColor; }
  .empty { color: var(--muted); font-size: 0.875rem; margin: 0; }
</style>
</head>
<body>
<header>
  <a href="/labs" aria-label="Back to Labs">‹ Labs</a>
  <h1>Tracker</h1>
  <button class="icon-btn" id="add-btn" type="button" aria-label="Add a goal" hidden><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
</header>
<main>
  <div id="list"><p class="msg">Loading…</p></div>
</main>
<script>
(function () {
  var API = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? 'http://' + location.hostname + ':' + (localStorage.getItem('labsApiPort') || '3001')
    : 'https://api-production-a551.up.railway.app'
  var BASE = API + '/labs/tracker'
  var token = null
  try { token = localStorage.getItem('bulbord_session_token') } catch (e) {}

  var listEl = document.getElementById('list')
  var addBtn = document.getElementById('add-btn')
  var goals = []
  var adding = false
  var openId = null // the expanded goal
  var titleEditing = null // the goal whose title is being edited (hold the title)
  var historyOpen = false
  var settingsOpen = false // the open goal's Settings (gear) section
  var justOpened = false
  var order = [] // goal ids; held still while a goal is open so it doesn't jump

  // Mirrors lab.ts.
  var WINDOW_DAYS = 56 // the score covers the last 8 weeks
  var MAX_STALE_DAYS = 3650
  var DEFAULT_STALE_DAYS = 14
  var DEFAULT_DAYS_PER_WEEK = 5
  var DEFAULT_EVERY_HOURS = 6
  var DEFAULT_TIMES_PER_WEEK = 10
  var MAX_EVERY_HOURS = 168
  var MAX_TIMES_PER_WEEK = 100
  var WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
  var PERIODS = [[7, 'Every week'], [14, 'Every 2 weeks'], [28, 'Every 4 weeks']]

  // A small, quiet "remove this entry" (the row's only control).
  function removeButton(entry) {
    var label = 'Delete the ' + fullDateLabel(entry.date) + ' entry'
    var b = el('button', { class: 'remove', type: 'button', 'aria-label': label, title: label, onclick: function () {
      if (confirm(label + '?')) deleteEntry(entry)
    } })
    b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>'
    return b
  }

  function api(method, path, body) {
    return fetch(BASE + path, {
      method: method,
      headers: Object.assign({ Authorization: 'Bearer ' + token }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined,
    }).then(function (res) {
      return res.json().catch(function () { return {} }).then(function (json) {
        if (!res.ok) { var err = new Error((json.error && json.error.message) || 'Something went wrong'); err.status = res.status; throw err }
        return json
      })
    })
  }

  function pad(n) { return (n < 10 ? '0' : '') + n }
  function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) }
  function todayIso() { return isoOf(new Date()) }
  function parseIso(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]) }
  function daysAgoIso(n) { var d = new Date(); d.setDate(d.getDate() - n); return isoOf(d) }
  // Whole days from today to iso: positive = future, negative = past.
  function daysFromToday(iso) { return Math.round((parseIso(iso) - parseIso(todayIso())) / 86400000) }
  function byName(a, b) { return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }) }
  function percent(n, of) { return Math.round((100 * n) / of) }

  // ---- Deriving each goal's state from its entries (viewer's time zone) ----
  // Entries come from the API newest date first.

  // The next one is the soonest entry after today, else today's.
  function nextEntry(goal) {
    var today = todayIso(), todays = null
    for (var i = goal.entries.length - 1; i >= 0; i--) {
      if (goal.entries[i].date > today) return goal.entries[i]
      if (goal.entries[i].date === today) todays = todays || goal.entries[i]
    }
    return todays
  }
  // Entries that have happened: up to and including today, except a plan's
  // next one.
  function pastEntries(goal) {
    var today = todayIso(), next = goal.type === 'plan' ? nextEntry(goal) : null
    return goal.entries.filter(function (e) { return e.date <= today && e !== next })
  }
  // How many of the last 8 weeks' periods (counted back from today) had an
  // entry dated today or earlier; `explain(n, periods)` says it in words.
  // `marks` has one class per period, oldest first.
  function periodScore(goal, periodDays, explain) {
    var periods = WINDOW_DAYS / periodDays, hit = {}
    goal.entries.forEach(function (e) {
      var ago = -daysFromToday(e.date)
      if (ago >= 0 && ago < WINDOW_DAYS) hit[Math.floor(ago / periodDays)] = true
    })
    var n = Object.keys(hit).length
    var marks = []
    for (var i = periods - 1; i >= 0; i--) marks.push(hit[i] ? 'on' : '')
    return { value: percent(n, periods), detail: explain(n, periods), marks: marks }
  }
  // A goal's days to record in the last 8 weeks, newest first, each with its
  // record (if any): a check-in's chosen weekdays, or every day of a weekly goal.
  // Today isn't one of them until it's over.
  function recordDays(goal) {
    var byDate = {}
    goal.entries.forEach(function (e) { byDate[e.date] = byDate[e.date] || e })
    var days = []
    for (var ago = 1; ago <= WINDOW_DAYS; ago++) {
      var iso = daysAgoIso(ago)
      if (!goal.weekdays || goal.weekdays.indexOf(parseIso(iso).getDay()) !== -1) days.push({ date: iso, ago: ago, entry: byDate[iso] || null })
    }
    return days
  }
  // Only the most recent day decides red or green and gets asked about; older
  // blanks just lower the score.
  function dayToRecord(goal) {
    var latest = recordDays(goal)[0]
    return latest && !latest.entry ? latest : null
  }
  // A day-by-day goal's question: about its most recent day (asked only until
  // it's answered).
  function askLatestDay(goal) {
    var day = recordDays(goal)[0]
    if (!day) return { empty: 'Nothing to answer yet' }
    var rel = relLabel(day.date)
    return {
      ending: (rel === 'yesterday' ? ' yesterday' : ' on ' + fullDateLabel(day.date)) + '?',
      answers: 'yesno',
      answer: function (outcome, note) { return addEntry(goal, { date: day.date, outcome: outcome, note: note }) },
    }
  }
  // Every day but one being asked about in the status box, newest first.
  function dayHistory(goal) {
    var days = recordDays(goal).slice(dayToRecord(goal) ? 1 : 0)
    return [foldedHistory(days.length, days.map(function (d) { return el('li', {}, [el('div', { class: 'body' }, [dayRow(goal, d)])]) }))]
  }
  function isKept(d) { return !!d.entry && d.entry.outcome === 'kept' }
  // Hours since a goal's last answer (entries are newest first).
  function hoursSinceAnswer(goal) {
    return goal.entries.length ? (Date.now() - Date.parse(goal.entries[0].at)) / 3600000 : Infinity
  }
  // Yes answers in each 7-day stretch counted back from today, this week first.
  function yesByWeek(goal) {
    var weeks = []
    for (var w = 0; w < WINDOW_DAYS / 7; w++) weeks.push(0)
    goal.entries.forEach(function (e) {
      var ago = -daysFromToday(e.date)
      if (e.outcome === 'kept' && ago >= 0 && ago < WINDOW_DAYS) weeks[Math.floor(ago / 7)]++
    })
    return weeks
  }
  function projectAge(goal) {
    var last = pastEntries(goal)[0]
    return last ? -daysFromToday(last.date) : Infinity
  }

  // Everything that differs by goal type: what turns it red, its question (`ask`,
  // plain data that statusBox draws the same way for every type), the score and
  // what it counts, the type's own settings, and the card's history. A type never
  // draws its own status box or answer buttons: anything one type does
  // differently is a field of `ask` or a setting, so the cards can't drift apart.
  //
  // ask(goal) returns { empty } when there's nothing to ask, or:
  //   stem     the question's start when the goal has no `question` setting
  //            (default: the title)
  //   ending   what follows it: ' yesterday?', ' in the last 6 hours?', '?'
  //   answers  'yesno' (Yes / No), 'yes' (Yes only) or 'date' (a date picker)
  //   note     a fact under the question ("Last done 9 days ago")
  //   answer(outcome, note) records an answer; date answers: pick(date)
  // It's only asked while the goal is red: answering turns it green, and the
  // answer then lives in History like every other.
  var TYPES = {
    plan: {
      label: 'Plan ahead',
      detail: 'Red until the next one is on the calendar. E.g. seeing friends, a date night.',
      isDue: function (goal) { return !nextEntry(goal) },
      ask: function (goal) {
        return { stem: 'When’s the next one', ending: '?', answers: 'date', pick: function (date) { return addEntry(goal, { date: date }) } }
      },
      score: function (goal) {
        var stretch = { 7: 'weeks', 14: 'two-week stretches', 28: 'four-week stretches' }[goal.period_days]
        return periodScore(goal, goal.period_days, function (n, of) { return n + ' of the last ' + of + ' ' + stretch })
      },
      settingField: function (goal) {
        var select = el('select', { 'aria-label': 'How often' }, PERIODS.map(function (p) {
          var option = el('option', { value: String(p[0]), text: p[1] })
          option.selected = (goal ? goal.period_days : 7) === p[0]
          return option
        }))
        return { node: el('label', {}, ['How often', select]), read: function () { return { period_days: Number(select.value) } } }
      },
      // History includes the upcoming one, at the top.
      body: function (goal) {
        return [historySection(goal.entries, dateField({
          value: '',
          label: 'Add a past date',
          max: daysAgoIso(1),
          onPick: function (date) { return addEntry(goal, { date: date }) },
        }))]
      },
    },
    progress: {
      label: 'Keep making progress',
      detail: 'Red once it’s been too many days since you last worked on it. E.g. a project.',
      isDue: function (goal) { return projectAge(goal) > goal.stale_days },
      ask: function (goal) {
        var last = pastEntries(goal)[0]
        return {
          ending: ' today?',
          answers: 'yes',
          note: last ? 'Last done ' + relLabel(last.date) : 'Not done yet',
          answer: function (outcome, note) { return addEntry(goal, { date: todayIso(), note: note }) },
        }

  function isDue(goal) { return TYPES[goal.type].isDue(goal) }

  // Lists show the full date, year included when it isn't this one.
  function fullDateLabel(iso) {
    var d = parseIso(iso)
    var opts = { weekday: 'short', month: 'short', day: 'numeric' }
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric'
    return d.toLocaleDateString(undefined, opts)
  }
  function shortDateLabel(iso) { return parseIso(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) }
  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1) }
  function relLabel(iso) {
    var days = daysFromToday(iso)
    if (days === 0) return 'today'
    if (days === 1) return 'tomorrow'
    if (days === -1) return 'yesterday'
    var n = Math.abs(days), span
    if (n < 14) span = n + ' days'
    else if (n < 60) span = Math.round(n / 7) + ' weeks'
    else if (n < 730) span = Math.round(n / 30) + ' months'
    else span = Math.round(n / 365) + ' years'
    return days > 0 ? 'in ' + span : span + ' ago'
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag)
    for (var k in attrs || {}) {

      else if (k === 'value') node.value = attrs[k]
      else if (k === 'checked') node.checked = !!attrs[k]
      else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), attrs[k])
      else if (attrs[k] !== false && attrs[k] != null) node.setAttribute(k, attrs[k] === true ? '' : attrs[k])
    }
    ;(children || []).forEach(function (c) { if (c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c) })
    return node
  }

  function render() {
    listEl.innerHTML = ''
    if (adding) listEl.appendChild(renderNewGoalForm())
    if (goals.length === 0 && !adding) listEl.appendChild(el('p', { class: 'msg', text: 'No goals yet — tap + to add one.' }))
    if (!openId || order.length !== goals.length) order = sortedGoals().map(function (g) { return g.id })
    order.forEach(function (id) { listEl.appendChild(renderGoal(goals.filter(function (g) { return g.id === id })[0])) })
    justOpened = false
    Array.prototype.forEach.call(listEl.querySelectorAll('.note-field'), fitNote)
    addBtn.hidden = false
  }

  // Red first, then green (upcoming plans soonest at the top), alphabetically.
  function sortedGoals() {
    var ranked = goals.map(function (goal) {
      var next = goal.type === 'plan' ? nextEntry(goal) : null
      return { goal: goal, rank: isDue(goal) ? 0 : next ? 1 : 2, next: next ? next.date : '' }
    })
    ranked.sort(function (a, b) {
      if (a.rank !== b.rank) return a.rank - b.rank
      if (a.next !== b.next) return a.next < b.next ? -1 : 1
      return byName(a.goal, b.goal)
    })
    return ranked.map(function (r) { return r.goal })
  }

  // "Add a goal", atop the list: the type, title, description and its setting.
  function renderNewGoalForm() {

    var descInput = el('textarea', { maxlength: '500', rows: '3', placeholder: 'e.g. I want to hang out with good friends more', 'aria-label': 'Description' })

      setting = TYPES[type].settingField(null)
      settingWrap.innerHTML = ''
      settingWrap.appendChild(setting.node)
    }
    showSetting()
    var types = el('div', { class: 'choices' }, Object.keys(TYPES).map(function (key) {
      return el('label', {}, [
        el('input', { type: 'radio', name: 'type', value: key, checked: type === key, onchange: function () { type = key; showSetting() } }),
        el('span', {}, [TYPES[key].label, el('small', { text: TYPES[key].detail })]),
      ])
    }))

    var cancel = el('button', { class: 'btn text', type: 'button', text: 'Cancel', onclick: function () { adding = false; render() } })

      el('label', { text: 'New goal' }),

  // One line per goal: a red or green bar, the title and the score ring.
  // Tapping the line expands the card in place, the line staying on top as
  // its header; tapping it again folds it back. Holding it edits the title.
  function renderGoal(goal) {

    return el('div', { class: 'card goal' + (isDue(goal) ? ' due' : '') + (open ? ' open' : '') }, [

  // Calls onHold after a half-second press that doesn't move (a scroll cancels).

    node.addEventListener('pointermove', function (e) {

  // The title being edited: saved on leaving it or Return; Escape or blank

    input.addEventListener('blur', function () { finish(input.value.trim()) })

  // The score as a ring, filled to the percent in one neutral color (red and
  // green only ever mean the status). Empty when there's nothing to score yet.
  function donut(score) {

    var ring = function (stroke, extra) { return '<circle cx="18" cy="18" r="15.9155" fill="none" stroke-width="4" stroke="' + stroke + '"' + (extra || '') + '/>' }

  // A date you tap to change, shown as text ("Mon, Nov 30  in 3 weeks"), saved

      label.textContent = fullDateLabel(input.value)

    return el('label', { class: 'date-field' + (opts.pick ? ' pick' : '') }, [label, rel, input])

  // A note that reads as plain text until tapped; saved on leaving it or Return.

  function noteField(value, placeholder, onSave, max, extraClass) {
    var area = el('textarea', { class: 'note-field' + (extraClass ? ' ' + extraClass : ''), rows: '1', maxlength: String(max || 200), placeholder: placeholder, 'aria-label': 'Note', value: value })
    area.addEventListener('input', function () { fitNote(area) })
    area.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); area.blur() } })
    area.addEventListener('blur', function () {

      if (text !== value.trim()) { value = text; onSave(text) }

  }

  // An existing entry's date and note, both tap-to-edit.

    return el('div', {}, [
      dateField({ value: entry.date, onPick: function (date) { return editEntry(entry, { date: date }) } }),
      noteField(entry.note || '', placeholder, function (note) { return editEntry(entry, { note: note }) }),
    ])
  }

  // A failed save says why, then shows what's really saved.
  function saving(request) {
    return request.then(load).catch(function (err) { alert(err.message); return load() })
  }
  function addEntry(goal, body) {
    return saving(api('POST', '/items/' + goal.id + '/entries', Object.assign({ today: todayIso() }, body)))
  }
  function saveGoal(goal, body) {
    return saving(api('PATCH', '/items/' + goal.id, body))
  }
  function editEntry(entry, body) {
    return saving(api('PATCH', '/entries/' + entry.id, Object.assign({ today: todayIso() }, body)))
  }
  function deleteEntry(entry) {
    return saving(api('DELETE', '/entries/' + entry.id))
  }

  // Past entries, newest first, folded away until tapped.
  function historySection(past, addField) {
    if (!past.length && !addField) return null
    return foldedHistory(past.length, past.map(function (entry) {
      return el('li', {}, [el('div', { class: 'body' }, [entryFields(entry, 'Add a note')]), removeButton(entry)])
    }), addField)
  }
  function foldedHistory(count, rows, addField) {
    var toggle = el('button', { class: 'history-toggle', type: 'button', 'aria-expanded': String(historyOpen), onclick: function () { historyOpen = !historyOpen; render() } })
    toggle.innerHTML = '<svg viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>'
    toggle.appendChild(document.createTextNode('History (' + count + ')'))
    return el('div', {}, [
      toggle,
      historyOpen ? el('ul', { class: 'history' }, rows) : null,
      historyOpen && addField ? el('div', { class: 'add-past' }, [addField]) : null,
    ])
  }

  // The question a red goal's type asks (TYPES[type].ask), drawn the same way
  // for every type: the question, its answer control, and a line under it.
  function statusBox(goal) {
    var ask = TYPES[goal.type].ask(goal)
    var question, control = null
    if (ask.empty) question = ask.empty
    else {
      question = questionStem(goal, ask) + ask.ending
      control = ask.answers === 'date'
        ? dateField({ value: '', label: 'Pick a date', pick: true, onPick: ask.pick })
        : answerButtons({ yesOnly: ask.answers === 'yes', answer: ask.answer })
    }
    return el('div', { class: 'status due' }, [
      el('div', { class: 'day-row' }, [el('div', { class: 'question' }, [question, ask.note ? el('span', { class: 'day-note', text: ask.note }) : null]), control]),
    ])
  }
  function questionStem(goal, ask) {
    return (goal.question || ask.stem || goal.name).replace(/[\s?.!:]+$/, '')
  }

  // Yes / No (or Yes alone) for every type and every day. Yes asks for an
  // optional note first; tapping the chosen answer again clears it.
  function answerButtons(opts) {
    var outcome = opts.chosen ? opts.chosen.outcome || 'kept' : null
    function button(value, text) {
      return el('button', { class: 'btn ' + (outcome === value ? value : 'outline'), type: 'button', text: text, 'aria-pressed': String(outcome === value), 'aria-label': opts.label ? text + ', ' + opts.label : null, onclick: function (e) {
        var b = e.currentTarget
        if (outcome === value) { b.disabled = true; deleteEntry(opts.chosen) }
        else if (value === 'kept') askNote(function (note) { b.disabled = true; opts.answer('kept', note) })
        else { b.disabled = true; opts.answer('missed', '') }
      } })
    }
    return el('div', { class: 'answers' }, [button('kept', 'Yes'), opts.yesOnly ? null : button('missed', 'No')])
  }

  // After a Did it / Kept: a bare note box. Skip while it's empty, Enter once
  // there's text; Escape or tapping outside skips. The day is recorded either way.
  function askNote(done) {
    var box = el('textarea', { rows: '3', maxlength: '500', placeholder: 'Describe this (optional)', 'aria-label': 'Note' })
    var button = el('button', { class: 'btn primary', type: 'button', text: 'Skip' })
    var dialog = el('dialog', { class: 'note-dialog' }, [box, el('div', { class: 'note-actions' }, [button])])
    var finished = false
    function finish() {
      if (finished) return
      finished = true
      var note = box.value.trim()
      if (dialog.open) dialog.close()
      dialog.remove()
      done(note)
    }
    box.addEventListener('input', function () { button.textContent = box.value.trim() ? 'Enter' : 'Skip' })
    box.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); finish() } })
    button.addEventListener('click', finish)
    dialog.addEventListener('close', finish)
    dialog.addEventListener('click', function (e) { if (e.target === dialog) finish() })
    document.body.appendChild(dialog)
    dialog.showModal()
    box.focus()
  }

  // A day to record: tap an answer; tap the current answer again to clear it.
  function dayRow(goal, day) {
    return el('div', { class: 'day-row' }, [
      el('div', { class: 'when' }, [
        fullDateLabel(day.date),
        el('span', { text: relLabel(day.date) }),
        day.entry && day.entry.note ? el('span', { class: 'day-note', text: day.entry.note }) : null,
      ]),
      answerButtons({ chosen: day.entry, label: fullDateLabel(day.date), answer: function (outcome, note) { return addEntry(goal, { date: day.date, outcome: outcome, note: note }) } }),
    ])
  }

  function showMessage(html) { listEl.innerHTML = '<p class="msg">' + html + '</p>'; addBtn.hidden = true }

  function load() {
    return api('GET', '/items').then(function (json) { goals = json.data; render() }).catch(function (err) {
      if (err.status === 401 || err.status === 403) showMessage('Sign in to Bulbord to use the tracker. <a href="/">Go to Bulbord</a>')
      else showMessage('Couldn’t load the tracker: ' + err.message.replace(/</g, '&lt;'))
    })
  }

  addBtn.addEventListener('click', function () {
    adding = true
    render()
    window.scrollTo(0, 0)
  })

  // Re-check red and the scores when coming back to the page (dates roll
  // over), unless a form is open (re-rendering would drop what's typed).
  window.addEventListener('pageshow', function (e) { if (e.persisted) load() })
  document.addEventListener('visibilitychange', function () { if (!document.hidden && token && goals.length && !adding && !openId) render() })

  if (!token) showMessage('Sign in to Bulbord to use the tracker. <a href="/">Go to Bulbord</a>')
  else load()
})()
</script>
</body>
</html>
