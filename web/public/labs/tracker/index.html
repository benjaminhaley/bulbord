<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Tracker</title>
<!--
  Tracker lab (see labs/tracker/README.md). Deliberately standalone: plain
  HTML/JS, no build step, no imports from the app in web/src. Its only links
  to Bulbord are (1) reading the member's session token from the same
  localStorage key the app uses, and (2) the API's sandboxed /labs/tracker
  routes. Nothing in the app depends on this file.
-->
<style>
  :root {
    --bg: #f4f4f6;
    --card: #ffffff;
    --ink: #1c1b1f;
    --muted: #6b6b70;
    --line: #e2e2e6;
    --bar: #2c2c2c;
    --bar-ink: #ffffff;
    --red: #c62828;
    --red-bg: #fdecec;
    --green: #2e7d32;
    --green-bg: #edf6ee;
    --accent: #3f51b5;
    --track: #e8e8ec;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Roboto, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 1;
    background: var(--bar); color: var(--bar-ink);
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
    display: flex; align-items: center; gap: 12px;
  }
  header a { color: var(--bar-ink); text-decoration: none; font-size: 0.9375rem; opacity: 0.85; }
  header h1 { margin: 0; font-size: 1.125rem; font-weight: 500; flex: 1; }
  .icon-btn { background: none; border: 0; padding: 8px; margin: -8px 0; border-radius: 50%; cursor: pointer; color: var(--muted); display: inline-flex; }
  .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
  header .icon-btn { color: var(--bar-ink); margin-right: -8px; }
  header .icon-btn svg { width: 28px; height: 28px; }
  main { max-width: 480px; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 32px); }
  .card {
    background: var(--card); border-radius: 12px; margin-bottom: 12px;
    border-left: 6px solid var(--green);
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    position: relative;
  }
  .card.due { border-left-color: var(--red); background: var(--red-bg); }
  /* A goal: one line (a red or green bar, the title, the score ring) that
     expands in place into the details. */
  .card.goal { margin-bottom: 8px; }
  .card.goal.open { background: var(--card); }
  .goal-row { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; padding: 8px 12px 8px 16px; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
  button.goal-row { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .goal-row input.title-field { flex: 1; min-width: 0; padding: 4px 8px; margin-left: -8px; font-weight: 500; }
  .goal-row .name { flex: 1; min-width: 0; font-size: 1rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.due .goal-row .name { color: var(--red); }
  .card.open .goal-row .name { white-space: normal; }
  .goal-body { padding: 0 16px 8px 16px; display: grid; gap: 14px; }
  .goal-body.opening { animation: unfold 160ms ease-out; }
  @keyframes unfold { from { opacity: 0; transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .goal-body.opening { animation: none; } }
  textarea.note-field.description { color: var(--muted); }
  .goal-body form { display: grid; gap: 8px; }
  .goal-body form.inline { padding: 0; }
  /* Why it's red or green, and when that changes. */
  .status { display: flex; align-items: flex-start; gap: 8px; border-radius: 10px; padding: 10px 12px; background: var(--green-bg); }
  .status.due { background: var(--red-bg); }
  .status.again { background: none; border: 1px solid var(--line); }
  .status > div { flex: 1; min-width: 0; }
  .status .title { font-size: 0.9375rem; font-weight: 500; color: var(--green); }
  .status.due .title { color: var(--red); }
  .status .detail { font-size: 0.875rem; margin-top: 2px; overflow-wrap: anywhere; }
  .status .fields { margin-top: 4px; }
  /* Fields you tap to edit in place; they read as plain text until then. A
     date is its label under an invisible native date input, which takes the
     tap and opens the picker. */
  .date-field { position: relative; display: inline-block; padding: 2px 0; font-size: 0.875rem; border-bottom: 1px dashed var(--muted); }
  .date-field b { color: var(--ink); }
  .date-field span { color: var(--muted); margin-left: 6px; }
  .date-field input[type=date] { position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0; padding: 0; border: 0; opacity: 0; cursor: pointer; }
  .date-field input[type=date]::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
  .date-field.pick b { color: var(--accent); }
  .day-row .date-field.pick { display: inline-block; margin: 0; padding: 6px 12px; border: 0; border-radius: 20px; box-shadow: inset 0 0 0 1px var(--line); font-size: 0.8125rem; font-weight: 500; }
  .date-field.pick { display: block; margin-top: 8px; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; color: var(--accent); font-size: 1rem; font-weight: 500; text-align: center; }
  textarea.note-field { display: block; min-height: 0; padding: 2px 0; border: 0; border-bottom: 1px solid transparent; border-radius: 0; background: transparent; resize: none; overflow: hidden; }
  textarea.note-field:focus { outline: none; border-bottom-color: var(--accent); }
  .history-toggle { display: flex; align-items: center; gap: 6px; width: 100%; margin: -6px 0; padding: 6px 0; background: none; border: 0; color: var(--muted); font: inherit; font-size: 0.875rem; text-align: left; cursor: pointer; }
  .history-toggle svg { width: 16px; height: 16px; fill: currentColor; transition: transform 120ms; }
  .history-toggle[aria-expanded=true] svg { transform: rotate(90deg); }
  .history-toggle svg.gear { transform: none; }
  .settings { display: grid; gap: 12px; }
  /* Settings: a list of sub-menus, each with its value; one opens in place. */
  .settings-list { display: grid; margin: -4px 0 -6px; }
  .settings-row { display: flex; align-items: center; gap: 8px; width: 100%; padding: 11px 0; background: none; border: 0; border-top: 1px solid var(--line); font: inherit; font-size: 0.875rem; color: var(--ink); text-align: left; cursor: pointer; }
  .settings-row .value { flex: 1; min-width: 0; text-align: right; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .settings-row svg { flex: none; width: 16px; height: 16px; fill: var(--muted); }
  .panel { display: grid; gap: 12px; }
  .panel-title { font-size: 0.875rem; font-weight: 500; color: var(--ink); }
  .target-row { display: flex; align-items: center; gap: 8px; font-size: 0.9375rem; color: var(--ink); }
  .target-row input[type=number] { width: 4em; padding: 6px 8px; text-align: center; -moz-appearance: textfield; appearance: textfield; }
  .target-row input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .target-row select { width: auto; padding: 6px 8px; }
  .setting .target-row select { color: var(--ink); text-align: left; border: 1px solid var(--line); -webkit-appearance: menulist; appearance: auto; }
  /* What the score counts: one mark per period, oldest to newest. Tapping the
     bar says how this goal's score is kept. */
  .score-bar { display: block; width: 100%; margin: -6px 0; padding: 6px 0; background: none; border: 0; cursor: pointer; }
  .score-how { margin: 8px 0 0; font-size: 0.875rem; color: var(--muted); line-height: 1.4; }
  .setting .toggle input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
  .marks { display: flex; gap: 3px; }
  .marks i { flex: 1; height: 8px; border-radius: 2px; background: var(--track); }
  .marks i.on { background: var(--green); }
  .stretches { display: flex; gap: 8px; }
  .stretches .marks { flex-basis: 0; min-width: 0; gap: 2px; }
  .marks i.fill { position: relative; overflow: hidden; }
  .marks i.fill b { position: absolute; inset: 0 auto 0 0; background: var(--green); }
  .score-bar .cadence { display: block; margin-top: 6px; font-size: 0.8125rem; color: var(--muted); text-align: left; }
  .marks i.kept { background: var(--green); }
  .marks i.missed { background: var(--red); }
  /* A check-in day: its date, then Kept / Missed to tap. */
  .day-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
  .day-row .when { flex: 1; min-width: 0; font-size: 0.875rem; }
  .day-row .question { flex: 1; min-width: 0; font-size: 0.9375rem; }
  .day-row .answers { display: flex; gap: 8px; }
  .question-setting { display: grid; gap: 4px; font-size: 0.875rem; }
  .question-input { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .question-input input { flex: 1; min-width: 0; }
  .day-row .question .note-field { margin-top: 2px; font-size: 0.8125rem; }
  .day-row .question .day-note { display: block; margin-top: 2px; }
  .history .body .day-note { display: block; color: var(--ink); font-size: 0.8125rem; overflow-wrap: anywhere; }
  .day-row .when .day-note { color: var(--ink); font-size: 0.8125rem; overflow-wrap: anywhere; }
  .note-dialog { width: min(440px, calc(100% - 32px)); border: 0; border-radius: 16px; padding: 16px; background: var(--card); color: var(--ink); }
  .note-dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
  .note-dialog textarea { width: 100%; box-sizing: border-box; }
  .note-dialog textarea:focus { outline: none; border-color: var(--accent); }
  .note-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
  .day-row .when span { display: block; color: var(--muted); font-size: 0.75rem; }
  .day-row .btn { padding: 6px 12px; font-size: 0.8125rem; background: var(--card); }
  .day-row .btn.kept { background: var(--green); }
  .day-row .btn.missed { background: var(--red); }
  .goal-foot { margin: -6px 0 0 -8px; }
  .goal-foot .btn.text { color: var(--muted); font-weight: 400; }
  /* The goal's setting, tap-to-change on the card. */
  .setting label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.875rem; }
  .setting select { width: auto; padding: 4px 0; border: 0; background: none; color: var(--accent); text-align: right; -webkit-appearance: none; appearance: none; }
  .setting input[type=number] { width: 3.5em; padding: 4px 8px; text-align: center; -moz-appearance: textfield; appearance: textfield; }
  .setting input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .setting .choices { gap: 4px; }
  .setting-detail { display: block; margin-top: 2px; color: var(--muted); font-size: 0.8125rem; }
  .setting .field-label { font-size: 0.875rem; }
  .setting .weekdays { flex-wrap: nowrap; gap: 4px; }
  .setting .weekdays label { flex: 1; position: relative; justify-content: center; padding: 6px 0; border: 1px solid var(--line); border-radius: 8px; font-size: 0.8125rem; color: var(--muted); cursor: pointer; }
  .setting .weekdays label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #fff; }
  .setting .weekdays input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .donut { position: relative; flex: none; width: 40px; height: 40px; display: inline-grid; place-items: center; }
  .donut svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .donut span { position: relative; font-size: 0.6875rem; font-weight: 500; }
  label { font-size: 0.75rem; color: var(--muted); display: grid; gap: 4px; }
  input[type=date], input[type=text], input[type=number], textarea, select {
    font: inherit; font-size: 1rem; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink); width: 100%;
  }
  input[type=number] { width: 6em; }
  textarea { resize: vertical; min-height: 4.5em; }
  input[type=date] { display: block; min-width: 0; max-width: 100%; -webkit-appearance: none; appearance: none; text-align: left; min-height: 44px; }
  input[type=date]::-webkit-date-and-time-value { text-align: left; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { font: inherit; font-size: 0.875rem; font-weight: 500; border-radius: 20px; padding: 8px 16px; border: 0; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.text { background: none; color: var(--accent); padding: 8px 8px; }
  .btn.outline { background: none; color: var(--accent); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.kept { background: var(--green); color: #fff; }
  .btn.missed { background: var(--red); color: #fff; }
  .btn.danger { background: none; color: var(--red); padding: 8px 8px; margin-left: auto; }
  .btn:disabled { opacity: 0.5; }
  form.inline { padding: 14px 16px; display: grid; gap: 10px; }
  .card.new { border-left-color: var(--accent); }
  .msg { text-align: center; color: var(--muted); padding: 40px 16px; }
  .msg a { color: var(--accent); }
  .error { color: var(--red); font-size: 0.875rem; }
  .choices { display: grid; gap: 6px; }
  .choices label { display: flex; gap: 8px; align-items: flex-start; font-size: 0.9375rem; color: var(--ink); }
  .choices small { display: block; color: var(--muted); font-size: 0.8125rem; }
  .field-label { font-size: 0.75rem; color: var(--muted); }
  .weekdays { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .weekdays label { display: flex; gap: 4px; align-items: center; font-size: 0.9375rem; color: var(--ink); }
  [hidden] { display: none !important; }
  .history { list-style: none; margin: 0; padding: 0; }
  .history { margin-top: 4px; }
  .history li { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; }
  .answers-in { list-style: none; margin: 0; padding: 0; }
  .answers-in li { padding: 2px 0; font-size: 0.875rem; }
  .history .none { display: block; font-size: 0.8125rem; color: var(--muted); }
  .history .body { flex: 1; min-width: 0; font-size: 0.9375rem; overflow-wrap: anywhere; }
  .add-past { margin-top: 6px; }
  .remove { flex: none; background: none; border: 0; padding: 4px; margin: -2px -4px -2px 0; color: #a0a0a6; cursor: pointer; display: inline-flex; }
  .remove svg { width: 18px; height: 18px; fill: currentColor; }
  .empty { color: var(--muted); font-size: 0.875rem; margin: 0; }
</style>
</head>
<body>
<header>
  <a href="/labs" aria-label="Back to Labs">‹ Labs</a>
  <h1>Tracker</h1>
  <button class="icon-btn" id="add-btn" type="button" aria-label="Add a goal" hidden><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
</header>
<main>
  <div id="list"><p class="msg">Loading…</p></div>
</main>
<script>
(function () {
  var API = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? 'http://' + location.hostname + ':' + (localStorage.getItem('labsApiPort') || '3001')
    : 'https://api-production-a551.up.railway.app'
  var BASE = API + '/labs/tracker'
  var token = null
  try { token = localStorage.getItem('bulbord_session_token') } catch (e) {}

  var listEl = document.getElementById('list')
  var addBtn = document.getElementById('add-btn')
  var goals = []
  var adding = false
  var openId = null // the expanded goal
  var titleEditing = null // the goal whose title is being edited (hold the title)
  var historyOpen = false
  var settingsOpen = false // the open goal's Settings (gear) section
  var settingsPanel = null // the Settings sub-menu that's open: 'title', 'asks', 'goal', 'question' or 'notes'
  var scoreInfoOpen = false // the open goal's "how the score is kept" (tap the bar)
  var justOpened = false
  var order = [] // goal ids; held still while a goal is open so it doesn't jump

  // Mirrors lab.ts.
  var WINDOW_DAYS = 56 // the score covers the last 8 weeks (a year for a yearly goal)
  var MAX_STALE_DAYS = 3650
  var DEFAULT_STALE_DAYS = 14
  var DEFAULT_EVERY_HOURS = 6
  var MAX_EVERY_HOURS = 168
  var MAX_TARGET = 365
  var DEFAULT_TARGET = { plan: 1, progress: 1, checkin: 7, often: 10 } // a week; a check-in's is every chosen day
  var ALL_DAYS = [0, 1, 2, 3, 4, 5, 6]
  var WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
  var PERIODS = [[7, 'a week'], [14, 'every 2 weeks'], [28, 'every 4 weeks'], [365, 'a year']]
  var PERIOD_LABEL = { 7: 'a week', 14: 'every 2 weeks', 28: 'every 4 weeks', 365: 'a year' }
  var PERIOD_ONE = { 7: ['week', 'weeks'], 14: ['two-week stretch', 'two-week stretches'], 28: ['four-week stretch', 'four-week stretches'], 365: ['year', 'years'] }
  var PERIOD_SPAN = { 7: 'Sunday to Saturday', 14: 'two weeks, Sunday to Saturday', 28: 'four weeks, Sunday to Saturday', 365: 'January to December' }

  // A small, quiet "remove this entry" (the row's only control).
  function removeButton(entry) {
    var label = 'Delete the ' + fullDateLabel(entry.date) + ' entry'
    var b = el('button', { class: 'remove', type: 'button', 'aria-label': label, title: label, onclick: function () {
      if (confirm(label + '?')) deleteEntry(entry)
    } })
    b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>'
    return b
  }

  function api(method, path, body) {
    return fetch(BASE + path, {
      method: method,
      headers: Object.assign({ Authorization: 'Bearer ' + token }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined,
    }).then(function (res) {
      return res.json().catch(function () { return {} }).then(function (json) {
        if (!res.ok) { var err = new Error((json.error && json.error.message) || 'Something went wrong'); err.status = res.status; throw err }
        return json
      })
    })
  }

  function pad(n) { return (n < 10 ? '0' : '') + n }
  function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) }
  function todayIso() { return isoOf(new Date()) }
  function parseIso(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]) }
  function daysAgoIso(n) { var d = new Date(); d.setDate(d.getDate() - n); return isoOf(d) }
  // Whole days from today to iso: positive = future, negative = past.
  function daysFromToday(iso) { return Math.round((parseIso(iso) - parseIso(todayIso())) / 86400000) }
  function byName(a, b) { return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }) }
  function percent(n, of) { return Math.round((100 * n) / of) }
  function plural(n, unit) { return n === 1 ? unit[0] : unit[1] }

  // ---- Deriving each goal's state from its entries (viewer's time zone) ----
  // Entries come from the API newest date first.

  // The next one is the soonest entry after today, else today's.
  function nextEntry(goal) {
    var today = todayIso(), todays = null
    for (var i = goal.entries.length - 1; i >= 0; i--) {
      if (goal.entries[i].date > today) return goal.entries[i]
      if (goal.entries[i].date === today) todays = todays || goal.entries[i]
    }
    return todays
  }
  // Entries that have happened: up to and including today, except a plan's
  // next one.
  function pastEntries(goal) {
    var today = todayIso(), next = goal.type === 'plan' ? nextEntry(goal) : null
    return goal.entries.filter(function (e) { return e.date <= today && e !== next })
  }
  // The day a goal started: the day it was created, or its first entry if
  // that's earlier (past dates logged after creating it).
  function startedIso(goal) {
    var created = goal.created_at ? isoOf(new Date(goal.created_at)) : todayIso()
    var first = goal.entries.length ? goal.entries[goal.entries.length - 1].date : created
    return first < created ? first : created
  }

  // Calendar periods (2026-11-19, Ben: the bar should be the weeks that have
  // passed, this week a partial one). A week is Sunday to Saturday; 2 and 4
  // weeks are fixed runs of those weeks; a year is a calendar year.
  function addDays(iso, n) { var d = parseIso(iso); d.setDate(d.getDate() + n); return isoOf(d) }
  function dayNumber(iso) { var p = iso.split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000) }
  function periodStart(iso, P) {
    if (P === 365) return iso.slice(0, 4) + '-01-01'
    var d = dayNumber(iso) - 3 // 1970-01-04 was a Sunday
    return addDays(iso, -(((d % P) + P) % P))
  }
  function periodEnd(startIso, P) { return P === 365 ? startIso.slice(0, 4) + '-12-31' : addDays(startIso, P - 1) }

  // Every goal's score, the same way (2026-11-16, Ben): its goal is
  // target_count in each target_period_days, counted in calendar periods
  // (above): the current one, which runs to today (yesterday for a check-in,
  // whose today isn't over), and the ones before it, back over the last 8 weeks
  // (a yearly goal: this year and last) or to when the goal started, whichever
  // is shorter. Each period counts up to its aim, so a big one can't make up
  // for a thin one. A period only partly counted (this one so far, or the one
  // the goal started in) aims for its share of the goal by days (a check-in:
  // chosen days), rounded, and counts in full if it reached more. What counts:
  // a plan's or progress goal's dates (one per day), a check-in's Yes days on
  // its chosen days, every Yes to an every-few-hours goal.
  function scoreOf(goal) {
    var type = goal.type, P = goal.target_period_days || 7, N = goal.target_count || 1
    var daily = type === 'checkin'
    var eligible = function (iso) { return !daily || goal.weekdays.indexOf(parseIso(iso).getDay()) !== -1 }
    var countDays = function (from, to) { var c = 0; for (var d = from; d <= to; d = addDays(d, 1)) if (eligible(d)) c++; return c }
    // A check-in's today counts once it's answered (answering early, from History).
    var answeredToday = daily && eligible(todayIso()) && goal.entries.some(function (e) { return e.date === todayIso() })
    var start = startedIso(goal), end = daily && !answeredToday ? daysAgoIso(1) : todayIso()
    if (end < start) return null
    var count = P === 365 ? 2 : Math.max(1, Math.round(WINDOW_DAYS / P))
    var periods = [], k, ps = periodStart(end, P)
    for (k = 0; k < count && periodEnd(ps, P) >= start; k++) {
      var pe = periodEnd(ps, P), from = ps < start ? start : ps, to = pe > end ? end : pe
      periods.unshift({ start: ps, from: from, to: to, full: countDays(ps, pe), days: countDays(from, to), hits: 0, partial: from !== ps || to !== pe })
      ps = periodStart(addDays(ps, -1), P)
    }
    var first = periods[0].from, seen = {}, byDate = {}
    goal.entries.forEach(function (e) {
      byDate[e.date] = byDate[e.date] || e
      if (e.date < first || e.date > end || !eligible(e.date)) return
      if ((type === 'checkin' || type === 'often') && e.outcome !== 'kept') return
      if (type !== 'often') { if (seen[e.date]) return; seen[e.date] = true }
      for (var i = periods.length - 1; i >= 0; i--) if (e.date >= periods[i].from) { periods[i].hits++; break }
    })
    var done = 0, total = 0
    periods.forEach(function (p) {
      p.aim = Math.max(p.full ? Math.round((N * p.days) / p.full) : 0, Math.min(p.hits, N))
      p.got = Math.min(p.hits, p.aim)
      done += p.got
      total += p.aim
    })
    periods = periods.filter(function (p) { return p.aim > 0 })
    if (!total) return null

    // The bar draws exactly what the percent counts (2026-11-17, Ben: the bars
    // should "match the percent seen in the donut"): one group per period, a
    // segment per Yes/time aimed for, filled for each one reached. A check-in
    // that aims for every chosen day draws its days instead (the same count,
    // and it shows which days were No).
    var byDay = daily && periods.every(function (p) { return p.aim === p.days })
    var marks = periods.map(function (p) {
      if (!byDay) return { aim: p.aim, got: p.got }
      var days = []
      for (var d = p.from; d <= p.to; d = addDays(d, 1)) if (eligible(d)) days.push(byDate[d] ? byDate[d].outcome || '' : '')
      return { days: days }
    })
    var cadence = byDay ? (goal.weekdays.length === 7 ? 'Every day' : 'Every ' + goal.weekdays.slice().sort().map(function (d) { return WEEKDAYS[d] }).join(', '))
      : N + (daily ? (N === 1 ? ' day ' : ' days ') : '× ') + PERIOD_LABEL[P]

    var unit = TYPES[type].unit, PERIOD = PERIOD_ONE[P], last = periods[periods.length - 1]
    var span = function (p) { return p.days + (daily ? (p.days === 1 ? ' chosen day' : ' chosen days') : (p.days === 1 ? ' day' : ' days')) }
    var partials = periods.filter(function (p) { return p.partial && p.aim < N }).map(function (p) {
      return (p === last && p.to === end && p.to !== periodEnd(p.start, P) ? 'This ' + PERIOD[0] + ' has had ' + span(p) + ' so far' : 'The ' + PERIOD[0] + ' it started in had ' + span(p) + ' from then') +
        ', so it aims for ' + p.aim + '. '
    })
    var detail = 'The goal is ' + N + ' ' + plural(N, unit) + ' ' + PERIOD_LABEL[P] + ', counted by ' + PERIOD[0] + ' (' + PERIOD_SPAN[P] + '). ' +
      (periods[0].from === start ? 'It counts from ' + fullDateLabel(start) + ', when this goal started, ' : 'It counts the last ' + periods.length + ' ' + plural(periods.length, PERIOD) + ', ') +
      'through ' + (end === todayIso() ? 'today' : 'yesterday') + ', each ' + PERIOD[0] + ' counting up to the goal. ' + partials.join('') +
      (daily ? 'Only Yes days count. ' : type === 'often' ? 'No answers don’t count. ' : '') +
      done + ' of ' + total + ', so ' + percent(done, total) + '%. ' +
      (byDay ? 'Each group is one ' + PERIOD[0] + ', oldest on the left, with a mark for each day: green Yes, red No, gray unanswered.'
        : 'Each group is one ' + PERIOD[0] + ', oldest on the left, with a mark for each one it aims for, green when reached.')
    return { value: percent(done, total), marks: marks, byDay: byDay, cadence: cadence, detail: detail }
  }
  // A check-in's days to record in the last 8 weeks (since the goal started,
  // if that's sooner), newest first, each with
  // its record (if any): its chosen weekdays.
  // Today isn't one of them (History adds it, to answer early; see dayHistory).
  function recordDays(goal) {
    var byDate = {}
    goal.entries.forEach(function (e) { byDate[e.date] = byDate[e.date] || e })
    var days = [], since = -daysFromToday(startedIso(goal))
    for (var ago = 1; ago <= Math.min(WINDOW_DAYS, since); ago++) {
      var iso = daysAgoIso(ago)
      if (goal.weekdays.indexOf(parseIso(iso).getDay()) !== -1) days.push({ date: iso, ago: ago, entry: byDate[iso] || null })
    }
    return days
  }
  // Only the most recent day decides red or green and gets asked about; older
  // blanks just lower the score.
  function dayToRecord(goal) {
    var latest = recordDays(goal)[0]
    return latest && !latest.entry ? latest : null
  }
  // A day-by-day goal's question: about its most recent day (asked only until
  // it's answered).
  function askLatestDay(goal) {
    var day = recordDays(goal)[0]
    if (!day) return { empty: 'Nothing to answer yet' }
    var rel = relLabel(day.date)
    return {
      ending: (rel === 'yesterday' ? ' yesterday' : ' on ' + fullDateLabel(day.date)) + '?',
      answers: 'yesno',
      answer: function (outcome, note) { return addEntry(goal, { date: day.date, outcome: outcome, note: note }) },
    }
  }
  // An every-few-hours or progress goal's History: one row per period of its goal (a
  // week, Sunday to Saturday, for "a week"), newest first, back to when it
  // started, answered or not (2026-11-19, Ben: a week without an answer
  // couldn't be filled in; it should read like the day-by-day goals). Each row
  // lists its answers (time, note to tap, ✕) and Yes / No (progress: Yes) to
  // add one, dated the period's last day (today for this one).
  function periodHistory(goal) {
    var P = goal.target_period_days || 7, today = todayIso(), start = startedIso(goal), rows = []
    for (var ps = periodStart(today, P); periodEnd(ps, P) >= start; ps = periodStart(addDays(ps, -1), P)) {
      rows.push(periodRow(goal, ps, periodEnd(ps, P), P, today))
    }
    return foldedHistory(rows.length, rows)
  }
  function periodRow(goal, ps, pe, P, today) {
    var date = pe > today ? today : pe
    var inside = goal.entries.filter(function (e) { return e.date >= ps && e.date <= pe })
    return el('li', {}, [el('div', { class: 'body' }, [
      el('div', { class: 'day-row' }, [
        el('div', { class: 'when' }, [periodLabel(ps, pe, P), el('span', { text: periodRel(ps, P) })]),
        answerButtons({ yesOnly: goal.type === 'progress', label: periodLabel(ps, pe, P), askNote: noteAsked(goal), answer: function (outcome, note) { return addEntry(goal, { date: date, outcome: outcome, note: note }) } }),
      ]),
      inside.length ? el('ul', { class: 'answers-in' }, inside.map(function (entry) {
        var time = goal.type === 'often' ? ', ' + new Date(entry.at).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : ''
        return el('li', {}, [
          el('div', { class: 'body' }, [shortDateLabel(entry.date) + time + ': ' + (entry.outcome === 'missed' ? 'No' : 'Yes'), entryNote(entry)]),
          removeButton(entry),
        ])
      })) : el('span', { class: 'none', text: 'No answer' }),
    ])])
  }
  function periodLabel(ps, pe, P) {
    if (P === 365) return ps.slice(0, 4)
    var a = parseIso(ps), b = parseIso(pe), opts = { month: 'short', day: 'numeric' }
    if (a.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric'
    return a.toLocaleDateString(undefined, opts) + ' – ' + (a.getMonth() === b.getMonth() ? b.getDate() : b.toLocaleDateString(undefined, opts))
  }
  function periodRel(ps, P) {
    var n = P === 365 ? +todayIso().slice(0, 4) - +ps.slice(0, 4) : Math.round((dayNumber(periodStart(todayIso(), P)) - dayNumber(ps)) / P)
    return n === 0 ? 'this ' + PERIOD_ONE[P][0] : n === 1 ? 'last ' + PERIOD_ONE[P][0] : n + ' ' + PERIOD_ONE[P][1] + ' ago'
  }

  // Every day but one being asked about in the status box, newest first.
  // Today is at the top on a chosen day, to answer early (2026-11-19, Ben);
  // it's never asked about or red, and counts once answered.
  function dayHistory(goal) {
    var days = recordDays(goal).slice(dayToRecord(goal) ? 1 : 0)
    var today = todayIso()
    if (goal.weekdays.indexOf(parseIso(today).getDay()) !== -1) {
      days.unshift({ date: today, ago: 0, entry: goal.entries.filter(function (e) { return e.date === today })[0] || null })
    }
    return [foldedHistory(days.length, days.map(function (d) { return el('li', {}, [el('div', { class: 'body' }, [dayRow(goal, d)])]) }))]
  }
  // "Sunday and Monday", or "day" when it's all seven.
  function weekdayNames(days) {
    if (days.length === 7) return 'day'
    var names = days.map(function (d) { return ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][d] })
    return names.length === 1 ? names[0] : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1]
  }
  function isKept(d) { return !!d.entry && d.entry.outcome === 'kept' }
  // Hours since a goal's last answer (entries are newest first).
  function hoursSinceAnswer(goal) {
    return goal.entries.length ? (Date.now() - Date.parse(goal.entries[0].at)) / 3600000 : Infinity
  }
  function projectAge(goal) {
    var last = pastEntries(goal)[0]
    return last ? -daysFromToday(last.date) : Infinity
  }

  // Every goal is made of the same parts (2026-11-16, Ben: every setting
  // available to every type, in sub-menus): when it asks (the goal's type, the
  // only thing in this table), the goal (target_count per target_period_days,
  // scored the same way for every type by scoreOf), the question's wording and
  // the notes. A type here never draws its own status box, answer buttons or
  // score: what differs is data, so the cards can't drift apart.
  //
  //   label, detail  the choice under Settings › When it asks
  //   summary(goal)  its value on the Settings list ("Every day", "Every 6 hours")
  //   unit           what the goal counts: [one, many]
  //   isDue(goal)    red
  //   modeField(goal) its own setting, { node, read }, or null
  //   body(goal)     the card's history
  //   ask(goal)      the question, plain data that statusBox draws the same way
  //                  for every type: { empty } when there's nothing to ask, or
  //     stem     the question's start when the goal has no `question` setting
  //              (default: the title)
  //     ending   what follows it: ' yesterday?', ' in the last 6 hours?', '?'
  //     answers  'yesno' (Yes / No), 'yes' (Yes only) or 'date' (a date picker)
  //     note     a fact under the question ("Last done 9 days ago")
  //     answer(outcome, note) records an answer; date answers: pick(date)
  // It's only asked while the goal is red: answering turns it green, and the
  // answer then lives in History like every other.
  var TYPES = {
    plan: {
      label: 'When nothing’s planned',
      detail: 'Asks for the next date whenever none is on the calendar. E.g. seeing friends, a date night.',
      summary: function () { return 'When nothing’s planned' },
      unit: ['time', 'times'],
      isDue: function (goal) { return !nextEntry(goal) },
      ask: function (goal) {
        return { stem: 'When’s the next one', ending: '?', answers: 'date', pick: function (date) { return addEntry(goal, { date: date }) } }
      },
      modeField: function () { return null },
      // History includes the upcoming one, at the top.
      body: function (goal) {
        return [historySection(goal.entries, dateField({
          value: '',
          label: 'Add a past date',
          max: daysAgoIso(1),
          onPick: function (date) { return addEntry(goal, { date: date }) },
        }))]
      },
    },
    progress: {
      label: 'After some days without it',
      detail: 'Asks once it’s been too many days since the last time. E.g. a project.',
      summary: function (goal) { return 'After ' + goal.stale_days + (goal.stale_days === 1 ? ' day' : ' days') + ' without it' },
      unit: ['day', 'days'],
      isDue: function (goal) { return projectAge(goal) > goal.stale_days },
      ask: function (goal) {
        var last = pastEntries(goal)[0]
        return {
          ending: ' today?',
          answers: 'yes',
          note: last ? 'Last done ' + relLabel(last.date) : 'Not done yet',
          answer: function (outcome, note) { return addEntry(goal, { date: todayIso(), note: note }) },
        }
      },
      // Done again today, before it's due (once a day).
      again: function (goal) {
        var last = pastEntries(goal)[0]
        return last && last.date === todayIso() ? null : TYPES.progress.ask(goal)
      },
      modeField: function (goal) {
        var input = el('input', { type: 'number', min: '1', max: String(MAX_STALE_DAYS), inputmode: 'numeric', value: String(goal && goal.stale_days ? goal.stale_days : DEFAULT_STALE_DAYS), 'aria-label': 'Days' })
        return {
          node: el('label', {}, ['Days without it until it asks', input]),
          read: function () { return { stale_days: wholeNumber(input.value, 'Days', MAX_STALE_DAYS) } },
        }
      },
      // Week by week, like every few hours (2026-11-19, Ben: Weekly house
      // project should be "updated to the new format").
      body: function (goal) { return [periodHistory(goal)] },
    },
    checkin: {
      label: 'Every day, or on set days',
      detail: 'Asks Yes or No about each chosen day, the day after. E.g. no drinking on Sundays and Mondays, or work on projects 5 days a week.',
      summary: function (goal) {
        return goal.weekdays.length === 7 ? 'Every day' : goal.weekdays.map(function (d) { return WEEKDAYS[d] }).join(', ')
      },
      unit: ['day', 'days'],
      isDue: function (goal) { return !!dayToRecord(goal) },
      ask: askLatestDay,
      modeField: function (goal) {
        var chosen = goal && goal.weekdays ? goal.weekdays : ALL_DAYS
        var boxes = WEEKDAYS.map(function (name, day) {
          return el('input', { type: 'checkbox', value: String(day), checked: chosen.indexOf(day) !== -1 })
        })
        return {
          node: el('div', { class: 'choices' }, [
            el('div', { class: 'field-label', text: 'Which days?' }),
            el('div', { class: 'weekdays' }, boxes.map(function (box, day) { return el('label', {}, [box, WEEKDAYS[day]]) })),
          ]),
          read: function () {
            var days = boxes.filter(function (b) { return b.checked }).map(function (b) { return Number(b.value) })

          },
        }
      },
      body: dayHistory,
    },
    often: {
      label: 'Every few hours',
      detail: 'Asks Yes or No again once the last answer is a few hours old, overnight too. E.g. did I think to yes and?',
      summary: function (goal) { return 'Every ' + hoursPhrase(goal.every_hours) },
      unit: ['Yes answer', 'Yes answers'],
      isDue: function (goal) { return hoursSinceAnswer(goal) >= goal.every_hours },
      // Each answer is a new entry; it asks again once the last is every_hours old.
      ask: function (goal) {
        return {
          ending: ' in the last ' + hoursPhrase(goal.every_hours) + '?',
          answers: 'yesno',
          answer: function (outcome, note) { return addEntry(goal, { date: todayIso(), outcome: outcome, note: note }) },
        }
      },
      // Answered as often as wanted (2026-11-19, Ben: "I should be able to add
      // an extra one"), so it can always add another.
      again: function (goal) { return TYPES.often.ask(goal) },
      modeField: function (goal) {
        var hours = el('input', { type: 'number', min: '1', max: String(MAX_EVERY_HOURS), inputmode: 'numeric', value: String(goal && goal.every_hours ? goal.every_hours : DEFAULT_EVERY_HOURS), 'aria-label': 'Hours' })
        return {
          node: el('label', {}, ['Hours without an answer until it asks', hours]),
          read: function () { return { every_hours: wholeNumber(hours.value, 'Hours', MAX_EVERY_HOURS) } },
        }
      },
      body: function (goal) {
        return [periodHistory(goal)]
      },
    },
  }

  function wholeNumber(value, what, max) {
    var n = Number(value)
    if (!Number.isInteger(n) || n < 1 || n > max) throw new Error(what + ' must be a whole number from 1 to ' + max)
    return n
  }

  // The goal, for every type: [count] [unit] [a week | every 2 weeks | every 4
  // weeks | a year]. A check-in can't aim for more days than it asks about.
  // opts.days() gives a check-in's chosen days (for its most); opts.onTouch is
  // called when the count is edited by hand.
  function maxTarget(type, days, period) { return type === 'checkin' ? Math.floor((days.length * period) / 7) : MAX_TARGET }
  function targetField(type, goal, opts) {
    var period = el('select', { 'aria-label': 'How often' }, PERIODS.map(function (p) {
      var option = el('option', { value: String(p[0]), text: p[1] })
      option.selected = (goal ? goal.target_period_days : 7) === p[0]
      return option
    }))
    var count = el('input', { type: 'number', min: '1', inputmode: 'numeric', 'aria-label': 'How many', value: String(goal ? goal.target_count : type === 'checkin' ? maxTarget(type, opts.days(), 7) : DEFAULT_TARGET[type]) })

    count.addEventListener('input', function () { refresh(); if (opts.onTouch) opts.onTouch() })
    refresh()

      count: count,
      refresh: refresh,
      read: function () {

        var n = wholeNumber(count.value, 'The goal', MAX_TARGET)
        if (n > most) throw new Error('This goal asks about ' + opts.days().length + (opts.days().length === 1 ? ' day' : ' days') + ' a week, so it can aim for at most ' + most + ' ' + PERIOD_LABEL[p] + '.')
        return { target_count: n, target_period_days: p }
      },
    }
  }
  function targetSummary(goal) {
    return goal.target_count + ' ' + plural(goal.target_count, TYPES[goal.type].unit) + ' ' + PERIOD_LABEL[goal.target_period_days]
  }

  // "6 hours", "day", "3 days", "week" (168 hours = once a week, 2026-11-16:
  // Playdate for Sebron asks weekly).
  function hoursPhrase(h) {
    if (h === 168) return 'week'
    if (h === 24) return 'day'
    if (h % 24 === 0) return h / 24 + ' days'
    return h === 1 ? 'hour' : h + ' hours'
  }

  function isDue(goal) { return TYPES[goal.type].isDue(goal) }

  // Lists show the full date, year included when it isn't this one.
  function fullDateLabel(iso) {
    var d = parseIso(iso)
    var opts = { weekday: 'short', month: 'short', day: 'numeric' }
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric'
    return d.toLocaleDateString(undefined, opts)
  }
  function shortDateLabel(iso) { return parseIso(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) }
  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1) }
  function relLabel(iso) {
    var days = daysFromToday(iso)
    if (days === 0) return 'today'
    if (days === 1) return 'tomorrow'
    if (days === -1) return 'yesterday'
    var n = Math.abs(days), span
    if (n < 14) span = n + ' days'
    else if (n < 60) span = Math.round(n / 7) + ' weeks'
    else if (n < 730) span = Math.round(n / 30) + ' months'
    else span = Math.round(n / 365) + ' years'
    return days > 0 ? 'in ' + span : span + ' ago'
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag)
    for (var k in attrs || {}) {
      if (k === 'text') node.textContent = attrs[k]
      else if (k === 'value') node.value = attrs[k]
      else if (k === 'checked') node.checked = !!attrs[k]
      else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), attrs[k])
      else if (attrs[k] !== false && attrs[k] != null) node.setAttribute(k, attrs[k] === true ? '' : attrs[k])
    }
    ;(children || []).forEach(function (c) { if (c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c) })
    return node
  }

  function render() {
    listEl.innerHTML = ''
    if (adding) listEl.appendChild(renderNewGoalForm())
    if (goals.length === 0 && !adding) listEl.appendChild(el('p', { class: 'msg', text: 'No goals yet — tap + to add one.' }))
    if (!openId || order.length !== goals.length) order = sortedGoals().map(function (g) { return g.id })
    order.forEach(function (id) { listEl.appendChild(renderGoal(goals.filter(function (g) { return g.id === id })[0])) })
    justOpened = false
    Array.prototype.forEach.call(listEl.querySelectorAll('.note-field'), fitNote)
    addBtn.hidden = false
  }

  // Red first, then green (upcoming plans soonest at the top), alphabetically.
  // Red first, then green; within each, lowest score first (2026-11-19, Ben),
  // a goal with nothing to score yet at the top of its group, then by name.
  function sortedGoals() {
    var ranked = goals.map(function (goal) {
      var score = scoreOf(goal)
      return { goal: goal, rank: isDue(goal) ? 0 : 1, score: score ? score.value : -1 }
    })
    ranked.sort(function (a, b) {
      if (a.rank !== b.rank) return a.rank - b.rank
      if (a.score !== b.score) return a.score - b.score
      return byName(a.goal, b.goal)
    })
    return ranked.map(function (r) { return r.goal })
  }

  // "Add a goal", atop the list: when it asks (and its own setting), the goal,
  // title and description.
  function renderNewGoalForm() {
    var type = 'plan'
    var nameInput = el('input', { type: 'text', maxlength: '80', placeholder: 'e.g. See friends', 'aria-label': 'Title' })
    var descInput = el('textarea', { maxlength: '500', rows: '3', placeholder: 'e.g. I want to hang out with good friends more', 'aria-label': 'Description' })
    var modeWrap = el('div', {}), targetWrap = el('div', {})
    var mode, target, touched = false
    function chosenDays() { return mode && mode.read && type === 'checkin' ? safeDays() : ALL_DAYS }
    function safeDays() { try { return mode.read().weekdays } catch (e) { return [] } }
    function showSetting() {
      mode = TYPES[type].modeField(null)
      modeWrap.innerHTML = ''
      if (mode) modeWrap.appendChild(mode.node)
      touched = false
      target = targetField(type, null, { days: chosenDays, onTouch: function () { touched = true } })
      targetWrap.innerHTML = ''
      targetWrap.appendChild(el('div', { class: 'choices' }, [el('div', { class: 'field-label', text: 'Goal' }), target.node]))
    }
    // A check-in aims for every chosen day until the goal is set by hand.
    modeWrap.addEventListener('change', function () {
      if (type === 'checkin' && !touched) { target.count.value = String(Math.max(1, safeDays().length)); target.refresh() }
    })
    showSetting()
    var types = el('div', { class: 'choices' }, [el('div', { class: 'field-label', text: 'When it asks' })].concat(Object.keys(TYPES).map(function (key) {
      return el('label', {}, [
        el('input', { type: 'radio', name: 'type', value: key, checked: type === key, onchange: function () { type = key; showSetting() } }),
        el('span', {}, [TYPES[key].label, el('small', { text: TYPES[key].detail })]),
      ])
    })))
    var errorEl = el('div', { class: 'error' })
    var save = el('button', { class: 'btn primary', type: 'submit', text: 'Add' })
    var cancel = el('button', { class: 'btn text', type: 'button', text: 'Cancel', onclick: function () { adding = false; render() } })
    var form = el('form', { class: 'inline', onsubmit: function (e) {
      e.preventDefault()
      var body
      try {
        if (!nameInput.value.trim()) throw new Error('Give it a title')
        body = Object.assign({ name: nameInput.value, description: descInput.value, type: type }, mode ? mode.read() : {}, target.read())
      } catch (err) { errorEl.textContent = err.message; return }
      save.disabled = cancel.disabled = true
      api('POST', '/items', body)
        .then(function () { adding = false; return load() })
        .catch(function (err) { errorEl.textContent = err.message; save.disabled = cancel.disabled = false })
    } }, [
      el('label', { text: 'New goal' }),
      el('label', {}, ['Title', nameInput]),
      el('label', {}, ['Description', descInput]),
      types,
      modeWrap,
      targetWrap,
      errorEl,
      el('div', { class: 'row' }, [save, cancel]),
    ])
    setTimeout(function () { nameInput.focus() }, 0)
    return el('div', { class: 'card new' }, [form])
  }

  // One line per goal: a red or green bar, the title and the score ring.
  // Tapping the line expands the card in place, the line staying on top as
  // its header; tapping it again folds it back. Holding it edits the title.
  function renderGoal(goal) {
    var open = openId === goal.id
    var score = scoreOf(goal)
    return el('div', { class: 'card goal' + (isDue(goal) ? ' due' : '') + (open ? ' open' : '') }, [
      titleEditing === goal.id
        ? el('div', { class: 'goal-row' }, [titleField(goal), donut(score)])
        : holdable(el('button', { class: 'goal-row', type: 'button', 'aria-expanded': String(open), onclick: function () {
            openId = open ? null : goal.id
            titleEditing = null
            historyOpen = false
            settingsOpen = false
            settingsPanel = null
            scoreInfoOpen = false
            justOpened = !open
            render()
          } }, [el('span', { class: 'name', text: goal.name }), donut(score)]), function () {
            justOpened = openId !== goal.id
            openId = goal.id
            historyOpen = false
            settingsOpen = false
            settingsPanel = null
            scoreInfoOpen = false
            titleEditing = goal.id
            render()
          }),
      open ? el('div', { class: 'goal-body' + (justOpened ? ' opening' : '') }, goalDetails(goal, score)) : null,
    ])
  }

  // Calls onHold after a half-second press that doesn't move (a scroll cancels).
  function holdable(node, onHold) {
    var timer, startX, startY
    function cancel() { clearTimeout(timer) }
    node.addEventListener('pointerdown', function (e) {
      startX = e.clientX
      startY = e.clientY
      timer = setTimeout(onHold, 500)
    })
    node.addEventListener('pointermove', function (e) {
      if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) cancel()
    })
    node.addEventListener('pointerup', cancel)
    node.addEventListener('pointercancel', cancel)
    node.addEventListener('pointerleave', cancel)
    node.addEventListener('contextmenu', function (e) { e.preventDefault() })
    return node
  }

  // The title being edited: saved on leaving it or Return; Escape or blank
  // keeps the old one.
  function titleField(goal) {
    var input = el('input', { class: 'title-field', type: 'text', maxlength: '80', value: goal.name, 'aria-label': 'Title' })
    function finish(text) {
      if (titleEditing !== goal.id) return
      titleEditing = null
      if (text && text !== goal.name) saveGoal(goal, { name: text })
      else setTimeout(render, 200) // after any tap that took the focus away lands
    }
    input.addEventListener('blur', function () { finish(input.value.trim()) })
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); input.blur() }
      if (e.key === 'Escape') { input.value = goal.name; input.blur() }
    })
    function focus() { input.focus(); input.select() }
    setTimeout(focus, 0)
    // A phone only opens its keyboard from a touch, so focus again on letting go.
    document.addEventListener('touchend', focus, { once: true })
    return input
  }

  // In order: the description, why it's red or green, what the score counts
  // (the ring above is its percent), the type's own contents, the setting, and
  // Delete. Everything is edited by tapping it where it is.
  function goalDetails(goal, score) {
    var type = TYPES[goal.type], due = isDue(goal)
    return [
      noteField(goal.description, 'Add a description', function (text) { return saveGoal(goal, { description: text }) }, 500, 'description'),
      // Only a red goal asks anything; once answered it's green and the answer
      // is in History.
      due ? statusBox(goal) : type.again && type.again(goal) ? statusBox(goal, type.again(goal)) : null,
      scoreBar(score),
    ].concat(type.body(goal)).concat([settingsSection(goal)])
  }

  // The score's marks, one per period or day; tapping them says how this goal's
  // score is kept (2026-11-13, Ben: the line above the bar was "unnecessary and
  // complicated").
  // One group per stretch, as wide as its aim. Small aims get one segment per
  // Yes/time; past MAX_SEGMENTS in all they'd be slivers, so each group is one
  // bar filled by got ÷ aim (the green length still matches the percent).
  var MAX_SEGMENTS = 40
  function stretchMarks(stretches) {
    var total = stretches.reduce(function (t, s) { return t + (s.days ? 0 : s.aim) }, 0)
    return el('div', { class: 'stretches', 'aria-hidden': 'true' }, stretches.map(function (s) {
      if (s.days) {
        var week = el('div', { class: 'marks' }, s.days.map(function (c) { return el('i', { class: c }) }))
        week.style.flexGrow = String(s.days.length)
        return week
      }
      var group = el('div', { class: 'marks' }, total <= MAX_SEGMENTS
        ? Array.apply(null, Array(s.aim)).map(function (_, i) { return el('i', { class: i < s.got ? 'on' : '' }) })
        : [el('i', { class: 'fill' }, [el('b', {})])])
      group.style.flexGrow = String(s.aim)
      if (total > MAX_SEGMENTS) group.querySelector('b').style.width = (100 * s.got / s.aim) + '%'
      return group
    }))
  }
  function scoreBar(score) {
    if (!score) return el('p', { class: 'empty', text: 'Nothing to score yet' })
    var bar = el('button', { class: 'score-bar', type: 'button', 'aria-expanded': String(scoreInfoOpen), 'aria-label': 'How the score is kept', onclick: function () { scoreInfoOpen = !scoreInfoOpen; render() } }, [
      stretchMarks(score.marks),
      el('span', { class: 'cadence', text: score.cadence }),
    ])
    return el('div', {}, [bar, scoreInfoOpen ? el('p', { class: 'score-how', text: score.detail }) : null])
  }

  // Settings, folded behind a gear so the card shows only the goal itself
  // (2026-11-10, Ben: "buried under a Settings gear"). Opened, it's a list of
  // sub-menus, each with its current value (2026-11-16, Ben: every setting
  // available to every type, in sub-menus): Title, Description (optional, any
  // type; 2026-11-16, Ben: e.g. "Current projects: …"), When it asks, Goal,
  // Question, Notes; then Delete goal. Tapping one opens it in place, with
  // "‹ Settings" to go back.
  var SETTINGS = [
    ['title', 'Title'],
    ['description', 'Description'],
    ['asks', 'When it asks'],
    ['goal', 'Goal'],
    ['question', 'Question'],
    ['notes', 'Notes'],
  ]
  function settingsSection(goal) {
    if (settingsOpen && settingsPanel) {
      var back = el('button', { class: 'history-toggle', type: 'button', onclick: function () { settingsPanel = null; render() } })
      back.innerHTML = '<svg viewBox="0 0 24 24" style="transform:rotate(180deg)"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>'
      back.appendChild(document.createTextNode('Settings'))
      return el('div', { class: 'settings' }, [back, el('div', { class: 'panel' }, settingsPanelContent(goal, settingsPanel))])
    }
    var toggle = el('button', { class: 'history-toggle', type: 'button', 'aria-expanded': String(settingsOpen), onclick: function () { settingsOpen = !settingsOpen; render() } })
    toggle.innerHTML = '<svg class="gear" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>'
    toggle.appendChild(document.createTextNode('Settings'))
    if (!settingsOpen) return el('div', { class: 'settings' }, [toggle])
    var values = {
      title: goal.name,
      description: goal.description || 'None',
      asks: TYPES[goal.type].summary(goal),
      goal: targetSummary(goal),
      question: questionText(goal),
      notes: notesSummary(goal),
    }
    return el('div', { class: 'settings' }, [
      toggle,
      el('div', { class: 'settings-list' }, SETTINGS.map(function (s) {
        if (s[0] === 'notes' && !values.notes) return null
        var row = el('button', { class: 'settings-row', type: 'button', onclick: function () { settingsPanel = s[0]; render() } }, [
          el('span', { text: s[1] }),
          el('span', { class: 'value', text: values[s[0]] }),
        ])
        row.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>')
        return row
      })),
      el('div', { class: 'goal-foot' }, [
        el('button', { class: 'btn text', type: 'button', text: 'Delete goal', onclick: function () {
          if (!confirm('Delete the "' + goal.name + '" goal?')) return
          openId = null
          saving(api('DELETE', '/items/' + goal.id))
        } }),
      ]),
    ])
  }

  function settingsPanelContent(goal, panel) {
    if (panel === 'title') return [titleSetting(goal)]
    if (panel === 'description') return [descriptionSetting(goal)]
    if (panel === 'asks') return asksSetting(goal)
    if (panel === 'goal') return goalSetting(goal)
    if (panel === 'question') return [questionSetting(goal)]
    return notesSetting(goal)
  }

  function titleSetting(goal) {
    var input = el('input', { type: 'text', maxlength: '80', value: goal.name, 'aria-label': 'Title' })
    input.addEventListener('change', function () {
      var text = input.value.trim()
      if (!text) { input.value = goal.name; return }
      if (text !== goal.name) saveGoal(goal, { name: text })
    })
    return el('label', { class: 'question-setting' }, [el('span', { text: 'Title' }), input])
  }

  // Optional, any type: shown at the top of the open card (also tap-to-edit
  // there). Empty = none.
  function descriptionSetting(goal) {
    var area = el('textarea', { maxlength: '500', rows: '3', placeholder: 'Optional', 'aria-label': 'Description' })
    area.value = goal.description || ''
    area.addEventListener('change', function () {
      var text = area.value.trim()
      if (text !== (goal.description || '')) saveGoal(goal, { description: text })
    })
    return el('label', { class: 'question-setting' }, [el('span', { text: 'Description' }), area])
  }

  // When it asks: the four ways, the chosen one's own setting under it.
  // Switching keeps the goal (a check-in's fitted to its days) and the
  // history; it asks first when entries would change, since the server carries
  // them over (to Yes / No answers, a logged date is a Yes; back to dates, a No
  // is removed; leaving plan, the upcoming plan is removed).
  var ANSWER_TYPES = { checkin: true, often: true }
  function asksSetting(goal) {
    var choices = el('div', { class: 'choices' }, [el('div', { class: 'panel-title', text: 'When it asks' })].concat(Object.keys(TYPES).map(function (key) {
      var radio = el('input', { type: 'radio', name: 'asks-' + goal.id, value: key, checked: key === goal.type, onchange: function () {
        var nos = goal.entries.filter(function (e) { return e.outcome === 'missed' }).length
        var upcoming = goal.type === 'plan' ? nextEntry(goal) : null
        var warn = ANSWER_TYPES[goal.type] && !ANSWER_TYPES[key] && nos
          ? 'Switching removes the ' + nos + ' No ' + (nos === 1 ? 'answer' : 'answers') + ' and keeps each Yes as a date.'
          : !ANSWER_TYPES[goal.type] && ANSWER_TYPES[key] && pastEntries(goal).length
            ? 'Switching counts each logged date as a Yes.'
            : ''
        if (upcoming && upcoming.date > todayIso()) warn += (warn ? ' ' : '') + 'The upcoming plan (' + fullDateLabel(upcoming.date) + ') is removed.'
        if (warn && !confirm(warn + ' Switch?')) { render(); return }
        saveGoal(goal, Object.assign({ type: key, today: todayIso() }, key === 'checkin' ? { weekdays: ALL_DAYS } : {}))
      } })
      return el('label', {}, [radio, el('span', {}, [TYPES[key].label, el('small', { text: TYPES[key].detail })])])
    })))
    var field = TYPES[goal.type].modeField(goal)
    return [choices, field ? el('div', { class: 'setting', onchange: function () {
      try { saveGoal(goal, field.read()) } catch (err) { alert(err.message); render() }
    } }, [field.node]) : null]
  }

  // The goal, any type, saved as soon as it changes.
  function goalSetting(goal) {
    var field = targetField(goal.type, goal, { days: function () { return goal.weekdays || ALL_DAYS } })
    var save = function () {
      try {
        var body = field.read()
        if (body.target_count !== goal.target_count || body.target_period_days !== goal.target_period_days) saveGoal(goal, body)
      } catch (err) { alert(err.message); render() }
    }
    field.count.addEventListener('change', save)
    field.node.querySelector('select').addEventListener('change', save)
    var how = goal.type === 'checkin' ? 'Yes days' : goal.type === 'often' ? 'Yes answers' : goal.type === 'plan' ? 'dates that happened' : 'days you did it'
    return [
      el('div', { class: 'panel-title', text: 'Goal' }),
      el('div', { class: 'setting' }, [field.node]),
      el('p', { class: 'setting-detail', text: 'The score counts ' + how + ' toward it by ' + PERIOD_ONE[goal.target_period_days][0] + ' (' + PERIOD_SPAN[goal.target_period_days] + '), over the last ' + (goal.target_period_days === 365 ? 'two years' : '8 weeks') + ', or since the goal started if that’s sooner (the day it was created, or its first date if that’s earlier). Each ' + PERIOD_ONE[goal.target_period_days][0] + ' counts up to the goal; this one so far aims for its share.' }),
    ]
  }

  // How the question is worded, in place of the title (empty = the default,
  // shown as the placeholder).
  function questionSetting(goal) {
    var ask = TYPES[goal.type].ask(goal)
    var input = el('input', { type: 'text', maxlength: '120', value: goal.question || '', placeholder: (ask.stem || goal.name).replace(/[\s?.!:]+$/, ''), 'aria-label': 'Question' })
    input.addEventListener('change', function () {
      var text = input.value.trim()
      if (text !== (goal.question || '')) saveGoal(goal, { question: text })
    })
    return el('label', { class: 'question-setting' }, [
      el('span', { text: 'Question' }),
      el('span', { class: 'question-input' }, [input, el('span', { text: ask.ending || '' })]),
    ])
  }
  function questionText(goal) {
    var ask = TYPES[goal.type].ask(goal)
    return ask.empty ? questionStem(goal, ask) + '?' : questionStem(goal, ask) + ask.ending
  }

  // Which answers open the optional note dialog: only the answers this type
  // has (a plan picks a date, so it has none; progress has Yes alone).
  function noteAnswers(goal) {
    var answers = TYPES[goal.type].ask(goal).answers || (goal.type === 'checkin' ? 'yesno' : '')
    return answers === 'yesno' ? ['kept', 'missed'] : answers === 'yes' ? ['kept'] : []
  }
  function noteAsked(goal) { return { kept: goal.ask_note !== false, missed: goal.ask_note_no === true } }
  function notesSummary(goal) {
    var on = noteAnswers(goal).filter(function (o) { return noteAsked(goal)[o] })
    if (!noteAnswers(goal).length) return ''
    if (!on.length) return 'Off'
    return 'After ' + on.map(function (o) { return o === 'kept' ? 'Yes' : 'No' }).join(' and ')
  }
  function notesSetting(goal) {
    var asked = noteAsked(goal)
    return [el('div', { class: 'panel-title', text: 'Ask for a note' })].concat(noteAnswers(goal).map(function (o) {
      var field = o === 'kept' ? 'ask_note' : 'ask_note_no'
      var box = el('input', { type: 'checkbox', checked: asked[o], onchange: function () {
        var change = {}; change[field] = box.checked; saveGoal(goal, change)
      } })
      return el('div', { class: 'setting' }, [el('label', { class: 'toggle' }, ['After ' + (o === 'kept' ? 'Yes' : 'No'), box])])
    }))
  }

  // The score as a ring, filled to the percent in one neutral color (red and
  // green only ever mean the status). Empty when there's nothing to score yet.
  function donut(score) {
    var v = score ? score.value : 0
    var ring = function (stroke, extra) { return '<circle cx="18" cy="18" r="15.9155" fill="none" stroke-width="4" stroke="' + stroke + '"' + (extra || '') + '/>' }
    var node = el('span', { class: 'donut', role: 'img', 'aria-label': score ? 'Score ' + v + '%' : 'No score yet' })
    node.innerHTML = '<svg viewBox="0 0 36 36">' + ring('var(--track)') +
      (v ? ring('var(--accent)', ' stroke-dasharray="' + v + ' 100" transform="rotate(-90 18 18)"') : '') +
      '</svg><span>' + (score ? v + '%' : '–') + '</span>'
    return node
  }

  // A date you tap to change, shown as text ("Mon, Nov 30  in 3 weeks"), saved
  // when the picker closes. Blur is the close on most browsers; the timer is a
  // fallback in case a phone's picker closes without one.
  function dateField(opts) {
    var label = el('b', { style: 'font-weight:inherit', text: opts.value ? fullDateLabel(opts.value) : opts.label })
    var rel = el('span', { text: opts.value && !opts.pick ? relLabel(opts.value) : '' })
    var input = el('input', { type: 'date', value: opts.value, max: opts.max || null, 'aria-label': opts.label || 'Change the date' })
    var saved = opts.value, timer
    function commit() {
      clearTimeout(timer)
      if (!input.value) { input.value = saved; return } // cleared: keep the old date
      if (input.value === saved) return
      saved = input.value
      opts.onPick(input.value)
    }
    input.addEventListener('change', function () {
      if (!input.value) return
      label.textContent = fullDateLabel(input.value)
      rel.textContent = relLabel(input.value)
      clearTimeout(timer)
      timer = setTimeout(commit, 1500)
    })
    input.addEventListener('blur', commit)
    input.addEventListener('click', function () { try { input.showPicker() } catch (e) {} })
    return el('label', { class: 'date-field' + (opts.pick ? ' pick' : '') }, [label, rel, input])
  }

  // A note that reads as plain text until tapped; saved on leaving it or Return.
  function fitNote(area) { area.style.height = 'auto'; area.style.height = area.scrollHeight + 'px' }
  function noteField(value, placeholder, onSave, max, extraClass) {
    var area = el('textarea', { class: 'note-field' + (extraClass ? ' ' + extraClass : ''), rows: '1', maxlength: String(max || 200), placeholder: placeholder, 'aria-label': 'Note', value: value })
    area.addEventListener('input', function () { fitNote(area) })
    area.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); area.blur() } })
    area.addEventListener('blur', function () {
      var text = area.value.trim()
      if (text !== value.trim()) { value = text; onSave(text) }
    })
    return area
  }

  // An existing entry's date and note, both tap-to-edit.
  // A Yes / No answer's note in History, tap to add or edit (every type).
  function entryNote(entry) {
    return noteField(entry.note || '', 'Add a note', function (note) { return editEntry(entry, { note: note }) }, 200, 'day-note')
  }
  function entryFields(entry, placeholder) {
    return el('div', {}, [
      dateField({ value: entry.date, onPick: function (date) { return editEntry(entry, { date: date }) } }),
      noteField(entry.note || '', placeholder, function (note) { return editEntry(entry, { note: note }) }),
    ])
  }

  // A failed save says why, then shows what's really saved.
  function saving(request) {
    return request.then(load).catch(function (err) { alert(err.message); return load() })
  }
  function addEntry(goal, body) {
    return saving(api('POST', '/items/' + goal.id + '/entries', Object.assign({ today: todayIso() }, body)))
  }
  function saveGoal(goal, body) {
    return saving(api('PATCH', '/items/' + goal.id, body))
  }
  function editEntry(entry, body) {
    return saving(api('PATCH', '/entries/' + entry.id, Object.assign({ today: todayIso() }, body)))
  }
  function deleteEntry(entry) {
    return saving(api('DELETE', '/entries/' + entry.id))
  }

  // Past entries, newest first, folded away until tapped.
  function historySection(past, addField) {
    if (!past.length && !addField) return null
    return foldedHistory(past.length, past.map(function (entry) {
      return el('li', {}, [el('div', { class: 'body' }, [entryFields(entry, 'Add a note')]), removeButton(entry)])
    }), addField)
  }
  function foldedHistory(count, rows, addField) {
    var toggle = el('button', { class: 'history-toggle', type: 'button', 'aria-expanded': String(historyOpen), onclick: function () { historyOpen = !historyOpen; render() } })
    toggle.innerHTML = '<svg viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>'
    toggle.appendChild(document.createTextNode('History (' + count + ')'))
    return el('div', {}, [
      toggle,
      historyOpen ? el('ul', { class: 'history' }, rows) : null,
      historyOpen && addField ? el('div', { class: 'add-past' }, [addField]) : null,
    ])
  }

  // The question a red goal's type asks (TYPES[type].ask), drawn the same way
  // for every type: the question, its answer control, and a line under it.
  // A green goal that can be answered again (TYPES[type].again) gets the same
  // question, untinted, so another one can be added any time.
  function statusBox(goal, again) {
    var ask = again || TYPES[goal.type].ask(goal)
    var question, control = null
    // Answering folds the card back to its one line (2026-11-13, Ben).
    function thenFold(record) { return function (a, b) { if (openId === goal.id) openId = null; return record(a, b) } }
    if (ask.empty) question = ask.empty
    else {
      question = questionStem(goal, ask) + ask.ending
      control = ask.answers === 'date'
        ? dateField({ value: '', label: 'Pick a date', pick: true, onPick: thenFold(ask.pick) })
        : answerButtons({ yesOnly: ask.answers === 'yes', askNote: noteAsked(goal), answer: thenFold(ask.answer) })
    }
    return el('div', { class: 'status' + (again ? ' again' : ' due') }, [
      el('div', { class: 'day-row' }, [el('div', { class: 'question' }, [question, ask.note ? el('span', { class: 'day-note', text: ask.note }) : null]), control]),
    ])
  }
  function questionStem(goal, ask) {
    return (goal.question || ask.stem || goal.name).replace(/[\s?.!:]+$/, '')
  }

  // Yes / No (or Yes alone) for every type and every day. Each answer asks for
  // an optional note first when the goal's settings say so (opts.askNote, by
  // outcome); tapping the chosen answer again clears it.
  function answerButtons(opts) {
    var outcome = opts.chosen ? opts.chosen.outcome || 'kept' : null
    function button(value, text) {
      return el('button', { class: 'btn ' + (outcome === value ? value : 'outline'), type: 'button', text: text, 'aria-pressed': String(outcome === value), 'aria-label': opts.label ? text + ', ' + opts.label : null, onclick: function (e) {
        var b = e.currentTarget
        if (outcome === value) { b.disabled = true; deleteEntry(opts.chosen) }
        else if (opts.askNote && opts.askNote[value]) askNote(function (note) { b.disabled = true; opts.answer(value, note) })
        else { b.disabled = true; opts.answer(value, '') }
      } })
    }
    return el('div', { class: 'answers' }, [button('kept', 'Yes'), opts.yesOnly ? null : button('missed', 'No')])
  }

  // After a Did it / Kept: a bare note box. Skip while it's empty, Enter once
  // there's text; Escape or tapping outside skips. The day is recorded either way.
  function askNote(done) {
    var box = el('textarea', { rows: '3', maxlength: '500', placeholder: 'Describe this (optional)', 'aria-label': 'Note' })
    var button = el('button', { class: 'btn primary', type: 'button', text: 'Skip' })
    var dialog = el('dialog', { class: 'note-dialog' }, [box, el('div', { class: 'note-actions' }, [button])])
    var finished = false
    function finish() {
      if (finished) return
      finished = true
      var note = box.value.trim()
      if (dialog.open) dialog.close()
      dialog.remove()
      done(note)
    }
    box.addEventListener('input', function () { button.textContent = box.value.trim() ? 'Enter' : 'Skip' })
    box.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); finish() } })
    button.addEventListener('click', finish)
    dialog.addEventListener('close', finish)
    dialog.addEventListener('click', function (e) { if (e.target === dialog) finish() })
    document.body.appendChild(dialog)
    dialog.showModal()
    box.focus()
  }

  // A day to record: tap an answer; tap the current answer again to clear it.
  function dayRow(goal, day) {
    return el('div', { class: 'day-row' }, [
      el('div', { class: 'when' }, [
        fullDateLabel(day.date),
        el('span', { text: relLabel(day.date) }),
        day.entry ? entryNote(day.entry) : null,
      ]),
      answerButtons({ chosen: day.entry, label: fullDateLabel(day.date), askNote: noteAsked(goal), answer: function (outcome, note) { return addEntry(goal, { date: day.date, outcome: outcome, note: note }) } }),
    ])
  }

  function showMessage(html) { listEl.innerHTML = '<p class="msg">' + html + '</p>'; addBtn.hidden = true }

  function load() {
    return api('GET', '/items').then(function (json) { goals = json.data; render() }).catch(function (err) {
      if (err.status === 401 || err.status === 403) showMessage('Sign in to Bulbord to use the tracker. <a href="/">Go to Bulbord</a>')
      else showMessage('Couldn’t load the tracker: ' + err.message.replace(/</g, '&lt;'))
    })
  }

  addBtn.addEventListener('click', function () {
    adding = true
    render()
    window.scrollTo(0, 0)
  })

  // Re-check red and the scores when coming back to the page (dates roll
  // over), unless a form is open (re-rendering would drop what's typed).
  window.addEventListener('pageshow', function (e) { if (e.persisted) load() })
  document.addEventListener('visibilitychange', function () { if (!document.hidden && token && goals.length && !adding && !openId) render() })

  if (!token) showMessage('Sign in to Bulbord to use the tracker. <a href="/">Go to Bulbord</a>')
  else load()
})()
</script>
</body>
</html>
